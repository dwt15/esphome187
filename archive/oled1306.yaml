# Example configuration entry
# captive_portal:
sensor:

  - platform: homeassistant
    id: eva105
    entity_id: sensor.eva105_current
    name: "105"
    internal: true 

  - platform: homeassistant
    id: pv
    entity_id: sensor.pv
    name: "pv"
    internal: true

  - platform: dallas
    address: 0xabdf8be908646128
    name: "Living Room Temp"

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 28

switch:
  - platform: gpio
    name: "Relay"
    id: sw1
    pin: 2

dallas:
  - pin: 12

 


#remote_receiver:
#  pin: 14
#    mode:
#      input: true
#      pullup: true
#  dump: all
remote_receiver:
  pin: 
    number: 14
    inverted: true
    mode:
      input: true
      pullup: true
  dump: all

binary_sensor:
# nec
  - platform: remote_receiver
    name: "pult1" # key1
    nec:
      address: 0xFF00
      command: 0xBA45
    on_press: 
      then:
          - switch.toggle: sw1
# samsung
  - platform: remote_receiver
    name: "pult1s" # key 1
    samsung:      
      data: 0xE0E020DF
    on_press: 
      then:
          - switch.toggle: sw1
# pioneer
  - platform: remote_receiver
    name: "pult2" # key 2    
    pioneer:
      rc_code_1: 0x0046
    on_press: 
      then:
          - switch.toggle: sw1
# lg
  - platform: remote_receiver
    name: "pult3" # key 3    
    lg:      
       data: 0x00FFE21D
       nbits: 32
    on_press: 
      then:
          - switch.toggle: sw1
