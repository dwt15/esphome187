i2c:
  sda: 4
  scl: 5


display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x32"
    id: my_display 
    #reset_pin: GPIO2
    address: 0x3C
    pages:
      - id: page1
        lambda: |-  
          it.printf(0,0,id(roboto),"P: %.0fw",id(pv).state);
      - id: page2
        lambda: |- 
           it.printf(0,0,id(roboto),"C1: %.1fA",id(eva105).state);
      
interval:
  - interval: 1s
    then:
    # - switch.toggle: sw1
  - interval: 11s
    then:
      #- switch.toggle: sw1
      - display.page.show: page1
      - component.update: my_display
      
      - delay: 5s
      #- switch.toggle: sw1
      - display.page.show: page2
      - component.update: my_display

