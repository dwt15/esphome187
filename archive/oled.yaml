esphome:
  name: oled
  friendly_name: oled

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "G7BddwspP38IwdxSaPC5cFhAzxYhINXull2VvaGSB18="

ota:
  password: "167c3f6a176f97acf84ba40da87847b2"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable fallback hotspot (captive portal) in case wifi connection fails
#  ap:
#    ssid: "Oled Fallback Hotspot"
#    password: "WqHwV8831hjP"
# Example configuration entry
# captive_portal:
sensor:

  - platform: homeassistant
    id: eva105
    entity_id: sensor.eva105_current
    name: "105"
    internal: true 

  - platform: homeassistant
    id: pv
    entity_id: sensor.pv
    name: "pv"
    internal: true

  - platform: homeassistant
    id: btcurr
    entity_id: sensor.bat_carrent
    name: "btcurr"
    internal: true



font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 28

i2c:
  sda: GPIO4
  scl: GPIO5

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x32"
    id: my_display 
    #reset_pin: GPIO2
    address: 0x3C
    pages:
      - id: page1
        lambda: |-               
          it.printf(0,0,id(roboto),"P: %1.0fw",id(pv).state);
      - id: page2
        lambda: |-
          it.printf(0,0,id(roboto),"C: %.1fA",id(btcurr).state);
      
interval:
  - interval: 11s
    then:
      - display.page.show: page1
      - component.update: my_display
      - delay: 5s
      - display.page.show: page2
      - component.update: my_display

