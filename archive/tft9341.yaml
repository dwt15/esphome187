sensor:

  - platform: homeassistant
    id: eva105
    entity_id: sensor.eva105_current
    name: "105"
    internal: true 

  - platform: homeassistant
    id: pv
    entity_id: sensor.pv
    name: "pv"
    internal: true   
  
color:
  - id: my_red
    red: 100%
    green: 3%
    blue: 5%

spi:
    clk_pin: GPIO14 # (Pin on display - SCK/T_CLK        D5 GPIO14)
    mosi_pin: GPIO13 # (Pin on display - SDI(MOSI)/T_DIN D7 GPIO13)
    miso_pin: GPIO12 # (Pin on display - SDO(MISO)/T_DO  D6 GPIO12)

display:
  - platform: ili9xxx
    model: ili9341
    
    cs_pin: GPIO4 # (Pin on display -      CS  D2 GPIO4)
    dc_pin: GPIO2 # (Pin on display -     D/C D4 GPIO2)        )
   # led_pin: GPIO32 # (Pin on display - LED 3v3)
    reset_pin: GPIO0 # (Pin on display - RESET D3 GPIO0)



    lambda: |-
       it.fill(my_red);

 