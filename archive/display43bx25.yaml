touchscreen:
  platform: gt911
  id: my_touch
#  i2c_id: bus_a
  address: 0x5D
  calibration:
    x_min: 11  # L:200    R:200 
    x_max: 433  # L:3830  R:3830 
    y_min: 13  # L:170    R:170
    y_max: 263 # L:3780   R:3780
#  transform:
#    swap_xy: true #  L:true  R:true
#    mirror_x: true # L:true  R:false
#    mirror_y: true # L:true  R:false
  on_touch:
     - lambda: |-
           ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
               touch.x,
               touch.y,
               touch.x_raw,
               touch.y_raw
               );  
#--------------- 
    
display:
  - platform: rpi_dpi_rgb
    id: my_display
    color_order: RGB
    invert_colors: True
    update_interval: never
    auto_clear_enabled: false # takes 2.8 seconds to clear the display
    dimensions:
      width: 480
      height: 272
    de_pin: 40
    hsync_pin: 39
    vsync_pin: 41
    pclk_pin: 42
    hsync_back_porch: 39
    hsync_front_porch: 50
    hsync_pulse_width: 4
    vsync_back_porch: 9
    vsync_front_porch: 8
    vsync_pulse_width: 4
    pclk_frequency: 4MHz
      
    data_pins:
      red:
        - 45        #r1
        - 48        #r2
        - 47        #r3
        - 21        #r4
        - 14        #r5
      green:
        - 5         #g0
        - 6         #g1
        - 7         #g2
        - 15        #g3
        - 16        #g4
        - 4         #g5
      blue:
        - 8         #b1
        - 3         #b2
        - 46        #b3
        - 9         #b4
        - 1         #b5        

lvgl:
  
  displays:
    - my_display
  touchscreens:
    - my_touch
  pages:
  
    - id: my_page1
      bg_color: 0x00FF00
      widgets:
     
        - label:
                
            text_font: montserrat_40
            text: 'Hello World!'
            x: 0
            y: 0
        - label:
            text_font: montserrat_40 
            text: 'Hello World!'
            x: 100
            y: 50
        - label:
            text_font: montserrat_40
            text_color: 0xFFFF00
            text: 'Hello World!'            
            y: 100       
        - label:
            text_font: montserrat_40
            text: 'Hello World!'
            x: 0
            y: 150    
        - label:
     #         text_font: montserrat_40
            text_color: 0xFF0000
            text: 'Hello World!'
            x: 0
            y: 200        
        - label:
            text_font: montserrat_30 
            text: 'Hello World!'
            x: 280
            y: 230	 
     # Example widget:
        - line:
            points:
              - 5, 5
              - 70, 70
              - 120, 10
              - 180, 60
              - 230, 15
            line_width: 8
            line_color: 0xFF00FF
            line_rounded: true

        - led:
            id: led_id
            align: CENTER
            color: 0xFF0000
            brightness: 100%
            # Example widget:
        - arc:
            x: 300
            y: 50
             
            id: arc_id
            value: 75
            min_value: 0
            max_value: 100
