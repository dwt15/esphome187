interval:
  - interval: 3s  
    then:
       - lambda: |-
           id(update_main).execute();  
           id(wifi_control).execute();  
           id(jk_bms_info).execute();

uart:
  - id: uart_0
    baud_rate: 115200
    rx_buffer_size: 384
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}

jk_modbus:
  - id: modbus0
    uart_id: uart_0
    rx_timeout: 50ms

jk_bms:
  - id: bms0
    jk_modbus_id: modbus0
    update_interval: 30s

binary_sensor:
  - platform: jk_bms
    balancing:
      name: "balancing"
    balancing_switch:
      name: "balancing switch"
    charging:
      name: "charging"
    discharging:
      name: "discharging"
    dedicated_charger_switch:
      name: "dedicated charger switch"
    online_status:
      name: "online status"

sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 30s
    entity_category: "diagnostic"
