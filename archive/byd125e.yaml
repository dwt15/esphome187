substitutions:
  name: byd125e
  device_description: "Monitor JK-BMS 480x320"  
  external_components_source: github://syssi/esphome-jk-bms@main
  tx_pin: GPIO3    #   бмс желтый -> displ tx черный
  rx_pin: GPIO1    #   бмс черный -> displ rx желтый  

 # icon
  i_wifi_on:  "\U000F05A9"  # mdi-wi-fi
  i_wifi_off: "\U000F05AA"  # mdi-wi-fi-off  
 # pos
  x1_4:  "0"
  x5_8:  "110"
  x9_12: "235"
  x13_16: "365" 
  y1_13:  "160"
  y2_14:  "195"  
  y3_15:  "230"
  y4_16:  "265"

  x1_8:  "235"
  x9_16: "365"
  y1_9:  "5"

 # cell voltage  
  wi_n:  "34"  # ширина поля для номера яч
  he_n:  "30"  # вісота поля для номера яч
  ps_x1: "0"   # Х позиция первого елемента
  ps_y1: "330" # У позиция первого елемента
  ps_xn: "5"   # позиция х номера внутри объекта  28: 3
  ps_yn: "1"  # позиция у номера внутри объекта  28:-1  
  dx_n:  "5"   # отсуп показания от номера
  dx_cv: "90"  # Х растояние между значекниями по х
  dy_cv: "10"  # У растояние между значекниями 
 # bar v
  dx_brv:  "5"   # растояние между столбами
  max_brv: "100" # макс значение
  min_brv: "0"   # мин  значение
  he_brv:  "100" # высота
  wi_brv:  "25"  # ширина wi_brv=30-dx_brv
  px_brv:  "0"   # х поз 
  py_brv:  "200" # у поз
  ln_brv:  "250" # у поз для линии =py_brv+50

 # jk bms info
  
  jk_bms_t1:  "name"                     # id: manufacturer
  jk_bms_t2:  "Password"                 # id: password
  jk_bms_t3:  "Total Time(h)"            # id: total_runtime
  jk_bms_t4:  "Total Time(d)"            # id: total_runtime_formatted 
  jk_bms_t5:  "Cycle Count"              # id: charging_cycles
  jk_bms_t6:  "Cycle Capacity(Ah)"       # id: total_charging_cycle_capacity 
  jk_bms_t7:  "Battery_type"             # id: battery_type  
  jk_bms_t8:  "Balance Trig Volt(V)"     # id: balance_opening_pressure_difference 
  jk_bms_t9:  "Start Balance Volt(V)"    # id: balance_starting_voltage 
  jk_bms_t10: "Cell OVP(V)"              # id: cell_voltage_overvoltage_protection      *напряжение отключения Power OFF(V)
  jk_bms_t11: "Cell VPR(V)"              # id: cell_voltage_overvoltage_recover
  jk_bms_t12: "Cell UVPR(V)"             # id: cell_voltage_undervoltage_protection
  jk_bms_t13: "Cell UVP(V)"              # id: cell_voltage_undervoltage_recovery
  jk_bms_t14: "Charge Curr(A)"           # id: charging_overcurrent_protection
  jk_bms_t15: "DisCharge Curr(A)"        # id: discharging_overcurrent_protection
  jk_bms_t1a: "wi-fi (db)"                # id: wifi_signal_db
  jk_bms_t2a: "ip_adress"                # id: ip_adress
  jk_bms_t3a: "ssid"                     # id: connected_ssid
  jk_bms_t4a: "pass" #
  jk_bms_t5a: "bsid" #
  jk_bms_t6a: "host name" #

esphome:
  name: byd125e
  friendly_name: byd125e
   
  comment: ${device_description}  
  on_boot:
    priority: 600
    then:     
      - output.turn_on: led_sv
      - output.turn_on: gpio_17
      - output.turn_on: gpio_16
      - output.turn_on: gpio_4
      - lambda: |-
            id(led_sv).set_level(0.3);


esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: arduino
    


   

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "WuHSLDc9dpyY/u3/fPJMYxkKpkCW0kyapPHcgUFKpXc="

ota:
  - platform: esphome
    password: "c7749aa91d1c5916b8177f8f43412345"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Vc Fallback Hotspot"
    password: "OtPPRwxtO8Fl"

captive_portal:

external_components:
  - source: ${external_components_source}
    refresh: 0s


output:
  - platform: ledc
    pin: 27
    id: led_sv 
  - platform: ledc
    pin: 17
    id: gpio_17 # blue
  - platform: ledc
    pin: 16
    id: gpio_16 # green       
  - platform: ledc
    pin: 4 
    id: gpio_4 # red


spi:
  clk_pin: 14
  mosi_pin: 13 # output data мастер выдает помошник принимает
  miso_pin: 12 # input data мастер  принимает помошник выдает
#--------------
touchscreen:
  platform: xpt2046
  id: my_touch
  cs_pin: 33
  calibration:
    x_min: 200
    x_max: 3830
    y_min: 170
    y_max: 3680
  transform:
    swap_xy: true #  для 2,8 красного true
    mirror_x: false # для 2,8 красного false
    mirror_y: true
  on_touch:
       - lambda: |-
           ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
              touch.x,
               touch.y,
              touch.x_raw,
              touch.y_raw
             );   
#--------------- 
display:
  - platform: ili9xxx
    model: ST7796   #ILI9341 #TFT 2.4
    id: my_display1     
    color_palette: 8BIT
    invert_colors: false
    cs_pin: 15  
    dc_pin: 2   
    #data_rate: 1MHz  # Установка частоты SPI на 40 МГц 
   # reset_pin: -1
    #    rotation: 270°
    transform:      
      mirror_x: true
      mirror_y: true
      swap_xy: true
    dimensions: 480x320
    #  height: 230 # 284 230 320
    #  width: 480 #  388 480 345 
    update_interval: 5s 

 


#------------------
lvgl:
  touchscreens:
    - my_touch
  displays:
    - my_display1
  buffer_size: 25%
  bg_color: 0x200000
  text_color: 0x00f000  
  style_definitions:



   # Volt, Amper , Ah 
    - id: style_lab_va  #   "V", "A", "Ah"
      text_font: RobotoCondensed_Regular_28 # 
      text_color: 0xb0b0f0    
    - id: style_val_va # значения "Volt", "curr", "Ah"
      text_font: BebasNeue_Regular_55 # 
      text_color: 0x00f000    
      text_letter_space: 4
   # cell
    - id: style_cell_voltage
      text_font: RobotoCondensed_Regular_28 # 
      text_color: 0x00f000 
    - id: style_cell_voltage_num
      text_font: RobotoCondensed_Regular_24 # 
      text_color: 0xb0b060       
    - id: style_cell_voltage_num_obj
      width:  "${wi_n}"
      height: "${he_n}" 
      radius: 10
      bg_color: 0x204080
      border_color: 0x000000
      border_width: 0
      outline_width: 0
      shadow_width: 0
      pad_all: 0                 
   # bar 
    - id: style_bar   
      width:  "${wi_brv}"   # 20
      height: "${he_brv}"  # 150
      radius: 0
      bg_color: 0x00ffff
      bg_opa: 50%
    - id: style_bar_i
      radius: 0  
      bg_color: 0x00FF00          # цвет залитой части (индикатора)
    - id: style_bar_a   
      width: 1000
      height: 20
      radius: 0
      bg_color: 0x00ffff
      bg_opa: 50%  
   # serv
    - id: style_serv1
      text_font: RobotoCondensed_Regular_24 # 
      text_color: 0xb0b060     
    - id: style_serv2
      text_font: RobotoCondensed_Regular_24 # 
      text_color: 0x00f000 
  pages:
    - id: main_page
      scrollbar_mode: "ACTIVE"  # показывать полосу прокрутки при прокрутке 
      scrollable: 'true'        # можно прокручивать страницу
      widgets:
       
       # obj V, A, Ah% ,bat_Ah
        - obj: # V          id: total_voltage                 
            id: obj_total_v
            x: 0
            y: 30
            height: 50
            width: 170
            scrollbar_mode: 'off'    # прокрутка показывать ползунок "ACTIVE" / "off" 
            scrollable: "false" #'true'       #'false' 
            bg_color: 0x000000
            outline_color: 0x000000
            outline_width: 2
            border_width: 0          
            border_color: 0x000000             
            widgets:
            - label:
                x: -3
                y: -15
                text_font: BebasNeue_Regular_45 # 
                text_color: 0xb0b060   
                text: "V"
            - label: # total_voltage
                id: total_voltage_lab
                x: 0
                y: -20
                align: TOP_RIGHT
                text_font: BebasNeue_Regular_55 # 
                text_color: 0x00f000   
                text_letter_space: 5
                text: "--.--"                
        - obj: # A          id: current                       
            id: obj_total_a
            x: 0
            y: 82
            scrollbar_mode: 'off'    # прокрутка показывать ползунок "ACTIVE" / "off" 
            scrollable: "false" #'true'       #'false'             
