                  else if(!id(pg2_main_gr_sw).state){p=off;}
                  else{p=id(pg2_main_watt_gr_sn).state;}
                if( fabsf(gr_watt-p)>1){
                   gr_watt = p;
                   if(     p==err){strcpy(buf, "-x-");}
                   else if(p==off){strcpy(buf, "---");}        
                   else{snprintf(buf, sizeof(buf), "%0.0f", p);}
                   lv_label_set_text(id(pg2_main_watt_gr), buf );                                 
                }                                                  
               //- bt  - - -               
                static float bt_watt= err; 
                if(isnan(id(pg2_main_watt_bt_sn).state)){p=err; } 
                  else{p=id(pg2_main_watt_bt_sn).state;}
                if(fabsf(bt_watt-p)>1){
                   bt_watt = p;
                   if(p==err){strcpy(buf, "---");} 
                   else{snprintf(buf, sizeof(buf), "%0.0f", p);}
                   lv_label_set_text(id(pg2_main_watt_bt), buf );                 
                   static bool st= true;
                   if((p>0) && !st ){ 
                      st = true;
                      lv_obj_set_style_text_color(id(pg2_main_watt_bt), lv_color_hex(${pg2_main_colr_watt}), LV_PART_MAIN);
                      } 
                    else if((p<0) && st ){
                      st = false;
                      lv_obj_set_style_text_color(id(pg2_main_watt_bt), lv_color_hex(${pg2_main_colr_wtgr}), LV_PART_MAIN);
                   }              
                }                 
               //- dm  - - - -                
                static float dm_watt= off; 
                if(isnan(id(pg2_main_watt_dm_sn).state)  ){p=err; } 
                  else if(!id(pg2_main_dm_sw).state){p=off;}
                  else{p=id(pg2_main_watt_dm_sn).state;}
                if(dm_watt !=p){
                   dm_watt = p;
                   if(     p==err){strcpy(buf, "-x-");} 
                   else if(p==off){strcpy(buf, "---");} 
                   else{snprintf(buf, sizeof(buf), "%0.0f", p);}
                   lv_label_set_text(id(pg2_main_watt_dm), buf );                 
                }                            
              //- - - k w h x - - - -                
                for(int i=0; i<4;i++){
                   if(isnan(sn_kwhx[i]->state)){p=err;} 
                     else {p=sn_kwhx[i]->state;}       
                   if(fabsf(kwhx[i]-p) > 0.04999 ){
                      kwhx[i] = p;
                      if(p==err){strcpy(buf, "--_"); strcpy(buf2, "-");} 
                        else{
                         p=p+0.05;
                         pi=int(p); pd=int(10*(p-pi));                    
                         snprintf(buf,  sizeof(buf), "%i.", pi);
                         snprintf(buf2, sizeof(buf), "%i",  pd);
                        }
                      lv_label_set_text(lv_kwhh[i], buf ); 
                      lv_label_set_text(lv_kwhl[i], buf2); 
                   } // закрыли обновление печать              
                } // закрыли цикл
   # - - - - - - - - - - - - - - - - - - - - - - - - - -  - - 
    - id: updata_main
      then:
        - lambda: |-
            //  
              static float p;
              static int pi,pd;              
              static char buf[16];
              static char buf2[16]; 
              static float err=-98765; 
              static float watt[]={-98765,-98765,-98765,-98765,};
              static float kwhx[]={-98765,-98765,-98765,-98765,};              
              
              static lv_obj_t* lv_watt[] = {                                             //                 
                              id(pg2_main_watt_pv),
                              id(pg2_main_watt_gr),
                              id(pg2_main_watt_bt),
                              id(pg2_main_watt_dm),
                              };
              static lv_obj_t* lv_kwhh[] = {                                             //                   
                              id(pg2_main_kwhh_pv),
                              id(pg2_main_kwhh_gr),
                              id(pg2_main_kwhh_bt),
                              id(pg2_main_kwhh_dm),
                              };       
              static lv_obj_t* lv_kwhl[] = {                                             //                   
                              id(pg2_main_kwhl_pv),
                              id(pg2_main_kwhl_gr),
                              id(pg2_main_kwhl_bt),
                              id(pg2_main_kwhl_dm),
                              };        
              static esphome::homeassistant::HomeassistantSensor*   sn_watt[]={
                                       id(sn_pv_watt),
                                       id(sn_gr_watt),
                                       id(sn_bt_watt),
                                       id(sn_dm_watt)};         
              static esphome::homeassistant::HomeassistantSensor*   sn_kwhx[]={
                                       id(sn_pv_kwhx),
                                       id(sn_gr_kwhx),
                                       id(sn_bt_kwhx),
                                       id(sn_dm_kwhx)};       
                  
            //  
              // обновление всех показателей 
               for(int i=0;i<4;i++){                
                //  watt    p o w e r         
                   
                   if(isnan(sn_watt[i]->state)){p=err;} 
                     else {p=fabsf(sn_watt[i]->state);}       
                   if(fabsf(watt[i]-p) > 1 ){
                      watt[i] = p;
                      if(p==err){strcpy(buf, "---");} 
                      else{snprintf(buf, sizeof(buf), "%0.0f", p);}
                      lv_label_set_text(lv_watt[i], buf ); 
                   } // закрыли обновление печать                 
                
                //  kwhx    e n e r g y
                   
                   if(isnan(sn_kwhx[i]->state)){p=err;} 
                     else {p=sn_kwhx[i]->state;}       
                   if(fabsf(kwhx[i]-p) > 0.0999 ){
                      kwhx[i] = p;
                      if(p==err){strcpy(buf, "--."); strcpy(buf2, "-");} 
                        else{pi=int(p); pd=int(10*(p-pi));                    
                         snprintf(buf,  sizeof(buf), "%i.", pi);
                         snprintf(buf2, sizeof(buf), "%i",  pd);
                        }
                      lv_label_set_text(lv_kwhh[i], buf ); 
                      lv_label_set_text(lv_kwhl[i], buf2); 
                   } // закрыли обновление печать              
               } // закрыли цикл

              //  дополнителные проверки    
               // 2-battery change/dichange
                static bool st= true;
                if(!isnan(sn_watt[2]->state)){
                  if((sn_watt[2]->state > 0) && !st ){ 
                     st = true;
                     lv_obj_set_style_text_color(lv_watt[2], lv_color_hex(${pg2_main_colr_watt}), LV_PART_MAIN);
                  } else if((sn_watt[2]->state < 0) && st ){
                     st = false;
                    lv_obj_set_style_text_color(lv_watt[2], lv_color_hex(${pg2_main_colr_wtgr}), LV_PART_MAIN);
                  }
                
                }
