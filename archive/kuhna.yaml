 #set: esphome, esp32, logger, api, ota, wifi img_snowy
  esphome:
    name: "kuhna"
    friendly_name: "kuhna"
    comment: "Кухня гл " 
    on_boot:
      priority: 600
      then:     
        
        - output.turn_on: led_tft
        - output.turn_on: led_red
        - output.turn_on: led_grn
        - output.turn_on: led_blu
        - lambda: |-
              id(led_tft).set_level(0.5); 
        - delay: 200ms
        - lvgl.page.show: pg2   

   # - - - - - - - - - - - - - - -  - -
  esp32:
    board: esp32dev
    flash_size: 4MB
    framework:
      #type: arduino
      type: esp-idf
      #version: 5.4.1
      #version: recommended
   # - - - - - - - - - - - - - - -  - -
   # Enable logging
  logger:

   # Enable Home Assistant API
