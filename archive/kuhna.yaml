      # update_interval: 5s 
    # - - - - - - - - - - - - - - - -   
 #ld2420, time, lvgl  
  ld2420: 
  time:
    - platform: sntp
      id: my_time
      timezone: "Europe/Kyiv"
      servers:
        - 0.pool.ntp.org
        - 1.pool.ntp.org
        - 2.pool.ntp.org
      update_interval: 3600s  
      on_time:  
        - hours: 2,3,4,5 
          minutes: 5
          seconds: 0      # Каждый день в 02:05, 03:05, 04:05 и 05:05
          then:
            - switch.turn_on: switch_antiburn # 05-й минуте каждого часа включается switch_antiburn
        - hours: 2,3,4,5
          minutes: 35
          seconds: 0  #
          then:
            - switch.turn_off: switch_antiburn  #  
  # -----------------------
  lvgl:
    touchscreens:
      - my_touch
    displays:
