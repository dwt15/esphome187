 #set : output, uart, rtttl, spi, touch, display 
  output:     
    - platform: ledc   # led_tft
      pin: ${pin_dsp_ld}
      id: led_tft  
    - platform: ledc   # led red
      pin: ${pin_led_red}
      id: led_red 
    - platform: ledc   # led gren
      pin: ${pin_led_grn}
      id: led_grn 
    - platform: ledc   # led blue
      pin: ${pin_led_blu}
      id: led_blu
    - platform: ledc   # buzzer
      pin: ${pin_buz}   #27 
      id: rtttl_out     
   # - - - - - - - - - - - - - - - - - - - 
  uart:          
    tx_pin: ${pin_ld2420_tx} #21
    rx_pin: ${pin_ld2420_rx} #22
    baud_rate: 115200  
   # - - - - - - - - - -   
  rtttl:         
    output: rtttl_out
    id: my_rtttl
    gain: 10%  
   # - - - - - - - - - - - - - - - - - - -   
  spi:                
    clk_pin:  ${pin_spi_clk}  #14
    mosi_pin: ${pin_spi_mosi} #13 # output data мастер выдает помошник принимает
    miso_pin: ${pin_spi_miso} #12 # input data мастер  принимает помошник выдает
   # - - - - - - - - - - - - - - 
  touchscreen:         
    platform: xpt2046
    id: my_touch
    cs_pin: ${pin_tch_cs}   #33
    calibration:
      x_min: 200
      x_max: 3830
      y_min: 320
      y_max: 3830
    transform:
      swap_xy: true #  для 2,8 красного true
      mirror_x: false # для 2,8 красного false
      mirror_y: true
    on_touch:
        - lambda: |-
            ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
                touch.x,
                touch.y,
                touch.x_raw,
                touch.y_raw
              );   
            id(my_rtttl).play("${beep1}");
    on_release:                         # отпустил палец от екрана
      then:
        - if:                           # если
            condition: lvgl.is_paused   # Проверяется, находится ли библиотека LVGL (графическая система) в режиме паузы.
            then:
              - lvgl.resume:            # Если LVGL действительно была «на паузе», эта команда возобновляет её работу.
              - lvgl.widget.redraw:     # Эта команда перерисовывает все объекты LVGL   
   # - - - - - - - - - - - - - - -  
  display:             
    - platform: ili9xxx
      model: ST7796   #ILI9341 #TFT 2.4
      id: my_display1     
      color_palette: 8BIT
      invert_colors: false
      cs_pin: ${pin_dsp_cs} #15  
      dc_pin: ${pin_dsp_dc} #2   
      # reset_pin: -1
