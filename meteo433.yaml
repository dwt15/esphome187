sensor:
 #-sysi 
  - platform: debug
    
    free:
      name: "Free Heap"
      id: free_memory
    #update_interval: 20s        
    # - - - - - - - - - - - - - -    
  - platform: template
    name: "Free "
    unit_of_measurement: "B"
    entity_category: "diagnostic"
    update_interval: 20s  
    lambda: |-
      return heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);
    # - - - - - - - - - - - - - -  
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    entity_category: "diagnostic"
    update_interval: 30s    

  
 # 
  - platform: ina226
    address: 0x40
    shunt_resistance: 0.002857 #0.1 ohm
    max_current: 25A
    # adc time used for both, Bus Voltage and Shunt Voltage
    adc_time: 140us
    adc_averaging: 128
    update_interval: 1s
    current:
      id: my_current   
       
      filters:
        - lambda: |-
            return x * ( -1);    
    power:
      id: my_power   
      filters:
        - lambda: |-
            return x * (id(my_current).state >= 0 ? 1 : -1);
    bus_voltage:
      id: my_voltage          
    shunt_voltage:
      id: my_shunt_v

  - platform: template
    id: my_power_signed
    lambda: |-
      return id(my_voltage).state * id(my_current).state;

  - platform: integration
    id: my_energy
    sensor: my_power_signed
    time_unit: h
    restore: true
    state_class: measurement
    device_class: energy
  


  - platform: template
    name: "Power"
    update_interval: 30s
    lambda: |-   
        return id(my_power).state;
    unit_of_measurement: W
    device_class: power
    state_class: measurement  
  
  - platform: template
    name: "Current"
    update_interval: 30s
    lambda: |-   
        return id(my_current).state;
    unit_of_measurement: A
    device_class: current
    state_class: measurement   
  
  - platform: template
    name: "Voltage"
    update_interval: 30s
    lambda: |-   
        return id(my_voltage).state;
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement  
  
  - platform: template
    name: "Energy"
    update_interval: 30s
    lambda: |-   
        return id(my_energy).state;
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing

  - platform: integration
    id: my_ah
    sensor: my_current
    time_unit: h
    restore: true
    state_class: measurement
    device_class: battery

  - platform: template
    name: "Ah"
    id: est_ah
    update_interval: 30s
    lambda: |-   
         const float full_ah=30; 
         const float max_volt=13.77;          
         const float min_volt=11.50;         
         const float min_curr=0.09;          
         if(id(my_voltage).state > max_volt  &&  id(my_current).state < min_curr) {
            id(sm_ah) = full_ah - id(my_ah).state;
             return full_ah;
          }
          else if(id(my_voltage).state < min_volt) {
                  id(sm_ah) =  - id(my_ah).state;
                  return 0;
          }          
          else{return (id(my_ah).state + id(sm_ah));}
    
    unit_of_measurement: ah
    device_class: energy
    state_class: total_increasing
  - platform: template
    name: "SOC"
    update_interval: 30s
    accuracy_decimals: 0
    unit_of_measurement: "%"
    lambda: |-
      return (int)(id(est_ah).state / 30);



globals:
  - id: sm_ah
    type: float
    restore_value: True
    initial_value: '10'

text_sensor:
  #sysi
  - platform: version
    name: "ESPHome Version"
    entity_category: "diagnostic"
    id: esphome_version
    # - - - - - - - - - - - - - -                  
  - platform: template      # esphome_name
    name: "esphome name"
    id: esphome_name
    entity_category: "diagnostic"
    lambda: |-
        return App.get_name();    
    # - - - - - - - - - - - - - -  
  - platform: wifi_info     # wifi
    ip_address:
      name: "IP Address"
      id: ip_adress                     
    ssid:
      name: "Connected SSID"
      id: connected_ssid
    bssid:
      name: "BSSID"
      id: bssid
    mac_address:
      name: "MAC Address"
      id: mac_address
    # - - - - - - - - - - - - - -  

interval:   
  - interval: 3s
    then:
       - output.turn_on: led_blue
       - delay: 1s
       - output.turn_off: led_blue









 