 #set: esphome, esp32, psram, loger, api, ota, wifi 000001
  esphome:
    name: display4880m
    comment: "serg 480x800" 
    friendly_name: display4880m
    #platformio_options:
    #  build_flags:  
    #    - -DLV_DRAW_SW_SUPPORT_RGB565=1
    #    - -DLV_DRAW_SW_SUPPORT_RGB565_A8=1
    #    - -DLV_DRAW_SW_SUPPORT_RGB565_SWAP=1
    on_boot:
      priority: -200
      then:
        - delay: 5s 
        - lambda: |-    
              id(led_tft).set_level(0.5);
                id(led_tft).set_level(id(display_yrkost)/100.0);
                //id(timer1)=true;
                 //id(my_rtttl).play("${beep1}");                 
        - rtttl.play: ${beep2}  
        

   # - - - - - - - - - - - - - -  - - - - - - - - - - - - - - - - - -  - - -   
  esp32:
    board: esp32-s3-devkitc-1     
    flash_size: 16MB
    framework:
      type:  esp-idf     
      advanced:
        execute_from_psram: true
   # - - - - - - - - - - - - - -  - - - - - - - - - - - - - - - - - -  - - -                 
  psram:
    mode: octal
    speed: 40MHz 
    
   # - - - - - - - - - - - - - -  - - - - - - - - - - - - - - - - - -  - - - 
  logger: 
    
    #level: DEBUG
    #level: INFO 
   # - - - - - - - - - - - - - -  - - - - - - - - - - - - - - - - - -  - - - 
  api:
    reboot_timeout: 10min      
    encryption:
      key: "lafDBFgzrYbYIu2f976x5OJFL15JNOaBojNHD7W/r/s="   
   # - - - - - - - - - - - - - -  - - - - - - - - - - - - - - - - - -  - - - 
  ota:
    - platform: esphome
      password: "d66eff79baed3c2ad28428630b108343"
   # - - - - - - - - - - - - - -  - - - - - - - - - - - - - - - - - -  - - - - 
  wifi:
    id: wifi_component
    use_address: 192.168.0.119
    reboot_timeout: 10min    
    #networks:
    #  - ssid: "Archer"
    #    password: "RDy9osW7"
    #    bssid: 28:EE:52:42:13:7F
    ssid: !secret wifi_ssid
    password: !secret wifi_password
    power_save_mode: none 
    on_connect:
      - script.execute: update_net_status
    on_disconnect:
      - script.execute: update_net_status
   
