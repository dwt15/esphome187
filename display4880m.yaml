  text_sensor:

    - platform: version
      name: "ESPHome Version"
      id: esphome_version
      on_value: 
        then:
          - lambda: |-
                std::string s = id(esphome_version).state;

                size_t start = s.find("(config hash");
                size_t end = s.find("built");

                if (start != std::string::npos && end != std::string::npos) {
                  s.erase(start+1, end - start-1);
                }
                lv_label_set_text(id(sysi_lab_d8), s.c_str());               //
                
    - platform: template      # esphome_name
      name: "esphome name"
