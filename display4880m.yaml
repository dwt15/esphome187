      - platform: sht3xd
        i2c_id: bus_a
        address: 0x44           
        temperature:
          name: "my_temperature"
          id: my_temperature
          filters:
            - lambda: return roundf(x * 10.0) / 10.0;
            - delta: 0.1
        humidity:
          name: "my_humidity"
          id: my_humidity
          filters:
            - lambda: return roundf(x );           
        
        
        update_interval: 20s
      # -- целые градусы
      - platform: template
        name: "my_temperature_int"
        id: my_temperature_int
        update_interval: 20s
        lambda: |-
          return (int)id(my_temperature).state;
      # -- десятые (первая цифра после запятой)
      - platform: template
        name: "my_temperature_dec"
        id: my_temperature_dec
        update_interval: 20s
        lambda: |-
          float t = id(my_temperature).state;
          return (int)(abs(t * 10)) % 10;
    
