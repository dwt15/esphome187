          - lambda: |-
               //
                 static lv_color_t clr;          //                 
                 static int st=-1; // 0-неизвестно, 1-float, 2-change, 3-dischange
                 static int sp=-1; 
                 static bool f;
                 const char*   icn;
                 if(isnan(id(sn_serverbat_current).state))  {sp=0;} //❓   неизвестно
                 if(id(sn_serverbat_current).state <0)      {sp=3;} // ⚡ dischange
                 if(id(sn_serverbat_current).state >0)      {sp=1;} //💤  float
                 if(id(sn_serverbat_current).state >0.099)  {sp=2;} // 🔌 change
                  if(st!= sp){
                     st = sp;
                     if(st==0){ f = true;  icn="${serverbat_icn_off}"; clr=lv_color_hex(${serverbat_clr_off});      } // offline
                     if(st==1){ f = false; icn="${serverbat_icn_on}";  clr=lv_color_hex(${serverbat_clr_float});    } // float
                     if(st==2){ f = false; icn="${serverbat_icn_on}";  clr=lv_color_hex(${serverbat_clr_change});   } // change
                     if(st==3){ f = true;  icn="${serverbat_icn_on}";  clr=lv_color_hex(${serverbat_clr_dischange});} // dischange
                     id(f_flash)[10] = f;
                     lv_label_set_text(            id(server_power), icn);                // icon
                     lv_obj_set_style_text_color(id(server_power), clr, LV_PART_MAIN);  // цвет 
                  }
        
