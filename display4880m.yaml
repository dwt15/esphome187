 #set: output, #rtttl, i2c, uart, #one_wire,touch, display, remote_receiver, ld2420, time
  debug:
  #spi:
  #  clk_pin: 10
  #  mosi_pin: 43
  #  miso_pin: 13
  #  interface: hardware  
  output:   # 2 яркость экрана
    - platform: ledc
      pin: ${pin_out_ledc} # 2   # яркость
      id: led_tft
      channel: 0   
      frequency: 1000 Hz
    - platform: ledc  # бузер     
      pin: ${pin_rtttl}
      #inverted: true
      channel: 2
      frequency: 100 Hz
      id: rtttl_out
    # - - - - - - - - - - - - - - - - - - - - - - - - - -  - -
  rtttl:
      output: rtttl_out
      id: my_rtttl
      gain: 50%
    # - - - - - - - - - - - - - - - - - - - - - - - - - -  - -
  i2c:      # тач 19,20
    sda: ${pin_i2c_sda} # 19 #19    тач
    scl: ${pin_i2c_scl} # 20
    scan: true
    id: bus_a
    # - - - - - - - - - - - - - - - - - - - - - - - - - -  - -
  #uart:     # ld2420
   # id: uart_ld2420
   # tx_pin: ${pin_uart_tx} # GPIO11 # желтый
   # rx_pin: ${pin_uart_rx} # GPIO12 # 
   # baud_rate: 115200  
    # - - - - - - - - - - - - - - - - - - - - - - - - - -  - -
  #one_wire: # 17 dallas температура
    #- platform: gpio
      #pin: ${pin_one_wire} # 17 # dallas температура
    # - - - - - - - - - - - - - - - - - - - - - - - - - -  - -
  touchscreen:
    platform: gt911
    id: my_touch
    i2c_id: bus_a
    address: 0x5D
    calibration:
      x_min: 11  # L:200    R:200 
      x_max: 800  # L:3830  R:3830 
      y_min: 13  # L:170    R:170
      y_max: 480 # L:3780   R:3780
    #  transform:
      #    swap_xy: true #  L:true  R:true
      #    mirror_x: true # L:true  R:false
      #    mirror_y: true # L:true  R:false
    on_touch:
        - lambda: |-
              ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
                  touch.x,
                  touch.y,
                  touch.x_raw,
                  touch.y_raw
                  );  
    on_release:                         # отпустил палец от екрана
      then:
        - if:                           # если
            condition: lvgl.is_paused   # Проверяется, находится ли библиотека LVGL (графическая система) в режиме паузы.
            then:
            #  - lvgl.resume:            # Если LVGL действительно была «на паузе», эта команда возобновляет её работу.
            #  - lvgl.widget.redraw:     # Эта команда перерисовывает все объекты LVGL 
              - switch.turn_off: switch_antiburn
    # - - - - - - - - - - - - - - - - - - - - - - - - - -  - -
  display:
    - platform: mipi_rgb #rpi_dpi_rgb     
      model: rpi #custom
      id: my_display
      color_order: RGB
      invert_colors: True
      update_interval: never
      auto_clear_enabled: false # takes 2.8 seconds to clear the display
      dimensions:
        width: 800
        height: 480
      de_pin:    ${pin_ds_de} # 41 
      hsync_pin: ${pin_ds_hs} # 39
      vsync_pin: ${pin_ds_vs} # 40 
      pclk_pin:  ${pin_ds_ck} # 42
      hsync_back_porch:  16     #39    16   16 fixed      x 
      hsync_front_porch: 210     #50    210 180-210-240
      hsync_pulse_width: 46     #4     30             y x+y =46
      vsync_back_porch:  10      #9     10  10 fixed   a a+b=23
      vsync_front_porch: 22      #8     22  12-22-32   
      vsync_pulse_width: 13      #4      4  13         b 
      pclk_frequency:    9MHz   #9MHz   16 
      pclk_inverted: true
      data_pins:
        red:
          - ${pin_ds_r3}   # 14        # 0 r3
          - ${pin_ds_r4}   # 21        # 1 r4
          - ${pin_ds_r5}   # 47        # 2 r5
          - ${pin_ds_r6}   # 48        # 3 r6
          - ${pin_ds_r7}   # 45        # 4 r7
        green:
          - ${pin_ds_g2}   # 9         # 0 g2
          - ${pin_ds_g3}   # 46        # 1 g3
          - ${pin_ds_g4}   # 3         # 2 g4
          - ${pin_ds_g5}   # 8         # 3 g5
          - ${pin_ds_g6}   # 16        # 4 g6
          - ${pin_ds_g7}   # 1         # 5 g7
        blue:
          - ${pin_ds_b3}   # 15        # 0 b3
          - ${pin_ds_b4}   # 7         # 1 b4
          - ${pin_ds_b5}   # 6         # 2 b5
          - ${pin_ds_b6}   # 5         # 3 b6
          - ${pin_ds_b7}   # 4         # 4 b7        
      #init_sequence:
      #  - [0x01]
      #  - [0x3A, 0x66]
    # - - - - - - - - - - - - - - - - - - - - - - - - - -  - - 
  remote_receiver: #
    pin: 
      number: ${pin_rem_rec}  #:22
      inverted: true
      mode:
        input: true
        pullup: true
    dump: all 
    # - - - - - - - - - - - - - - - - - - - - - - - - - -  - -
  #ld2420:
   # id: ld_sensor
   # uart_id: uart_ld2420

   # - - - - - - - - - - - - - - - - - - - -  
  time:
    - platform: sntp
      id: my_time
      timezone: "Europe/Kyiv"
      servers:
        - 0.pool.ntp.org
        - 1.pool.ntp.org
        - 2.pool.ntp.org
      update_interval: 3600s
      on_time:
        - seconds: /1  # каждую секунду
          then:
            - lambda: |-
                //
                  auto now = id(my_time).now();
                  if (!now.is_valid()) return;
                  static int last_sec = -1;
                  static int last_min = -1;
                  static int last_hour = -1;
                  static int last_day = -1;
                  static int last_month = -1;
                  static int last_wday = -1;    
                  int sec = now.second;
                  int min = now.minute;
                  int hour = now.hour;
                  int day = now.day_of_month;
                  int month = now.month;
                  int wday = now.day_of_week;  // 0 = воскресенье, 1 = понедельник ...
                  char buf[20];
                // СЕКУНДЫ   {time_t3}
                  if (sec != last_sec) {
                    last_sec = sec;
                    snprintf(buf, sizeof(buf), "%02d", sec);
                    lv_label_set_text(id(time_t3), buf);
                  }
                // МИНУТЫ + ЧАСЫ
                  
                  if (min != last_min) {
                    last_min = min;
                    snprintf(buf, sizeof(buf), "%2d:%02d", hour,  min);
                    lv_label_set_text(id(time_t2), buf);
                  }
                // ЧАСЫ
                  //if (hour != last_hour) {
                  //  last_hour = hour;
                  //  snprintf(buf, sizeof(buf), "%02d", hour);
                  //  lv_label_set_text(id(time_t3), buf);
                  //}
                // день недели
                  if (wday != last_wday) {
                    last_wday = wday;
                    const char* wday_names[] = {"ВС","ПН","ВТ","СР","ЧТ","ПТ","СБ"}; // массив наименований день недели{
                    lv_label_set_text(id(time_t1), wday_names[wday-1]);                      
                    lv_color_t colort = lv_color_make(0,200,0);  // цвет нормальный
                    if (wday == 1 or wday == 7 ) {colort = lv_color_make(255,150,0);}  // воскресенье суббота
                    lv_obj_set_style_text_color(id(time_t1), colort, LV_PART_MAIN); // цвет дня недели
                    colort = lv_color_make(0,200,0);  // цвет нормальный
                    if (wday == 1) {colort = lv_color_make(255,150,0);}  // воскресенье
                    lv_obj_set_style_text_color(id(time_td), colort, LV_PART_MAIN); // цвет даты  
                  }
                // день месяца
                  if (day != last_day) {
                    last_day = day;
                    snprintf(buf, sizeof(buf), "%2d", day);
                    lv_label_set_text(id(time_td), buf);
                  }
                // месяц
                  if (month != last_month) {
                    last_month = month;
                    snprintf(buf, sizeof(buf), "%02d",  month); 
                    lv_label_set_text(id(time_tm),  buf  );
                  }   
        - hours: 2,3,4,5 
          minutes: 5
          seconds: 0      # Каждый день в 02:05, 03:05, 04:05 и 05:05
          then:
            - switch.turn_on: switch_antiburn # 05-й минуте каждого часа включается switch_antiburn
        - hours: 2,3,4,5
          minutes: 35
          seconds: 0  #
          then:
            - switch.turn_off: switch_antiburn  #
    # - - - - - - - - - - - - - - - - - - - - - - - - - -  - -      

