                for(int i=0; i<n_but; i++){
                  // тацмер принудительного обновления
                      if( t_butt[i] < per) {t_butt[i]++;}
                      else {t_butt[i] = 0;    s_butt[i]  = -1;}         
                  // выясняем в каком состоянии кнопка                                                                                                
                      if(!(butt_a[i]->state)) { 
                        // 0 - не в сети 
                          sbut = 0;                                                            // 0- нет подключения
                          if( s_butt[i] != sbut ) {                                            // новое состояние
                              s_butt[i] = 0;                                                   // запоминаем   
                              t_butt[i] = 0;
                              lv_obj_set_style_text_color(  butt_i[i], lv_color_hex(${butt_colr_ic_off}), LV_PART_MAIN);  // цвет иконки  0 серый
                              lv_obj_set_style_bg_color(    butt_b[i], lv_color_hex(${butt_colr_bg_off}), LV_PART_MAIN); // цвет конпки 4 черн          
                              lv_obj_set_style_border_color(butt_b[i], lv_color_hex(${butt_colr_ic_off}), LV_PART_MAIN);  // цвет контура 0серый
                              lv_obj_clear_flag( butt_x[i], LV_OBJ_FLAG_HIDDEN);               // показать "X"                              
                          } // закрыли отображение розетка не в сети
                      }else{ // 1-в сети                                  
                            sbut = 1;  
                        // включена/ выключена                                                    
                            if( butt_s[i]->state ){          //  ON ?                                                                         
                                sbut  = 2;                   // 2-включен без нагрузки                                                                                   
                                if( butt_p[i]->state > 5 ){  // нагрузка ?                   
                                    sbut  = 3;                // 3- работа под нагрузкой
                                }  // выяснили нагрузка есть нет
                            }    // выянили: включена/выключена ,нагрузка/простой
                      }          // закрыли обработку розетка в сети
                  // приступаем к отображению всех сосотояний
                    if (  s_butt[i]  !=  sbut  ){              // состояние кнопки поменялось все прекрашиваем                              
                          s_butt[i]  =  sbut ;                 // сохраняем новое состояние кнопки
                          t_butt[i] = 0;                       // таймер принудительного обновления обнулили                
                    ESP_LOGI("tag", "updata butt: %d  status: %d", i+1 ,s_butt[i]);                      
                          if( !lv_obj_has_flag( butt_x[i], LV_OBJ_FLAG_HIDDEN)){ lv_obj_add_flag( butt_x[i], LV_OBJ_FLAG_HIDDEN);} // убрать "Х"  
                          if(sbut == 1){   // виден состояние откл ожидание
                          
                          //lv_obj_clear_state(            butt_b[i], LV_STATE_CHECKED);                     // off 
                              lv_obj_set_style_text_color(   butt_i[i], lv_color_hex(${butt_colr_ic_off}), LV_PART_MAIN);          // color0цвет иконки  0 серый
                              lv_obj_set_style_bg_color(     butt_b[i], lv_color_hex(${butt_colr_bg_off}), LV_PART_MAIN);          // color4цвет конпки 4 черн          
                              lv_obj_set_style_border_color( butt_b[i], lv_color_hex(${butt_colr_ic_off}), LV_PART_MAIN);}         //color0 цвет контура 0серый
                            else{      // 2-включен  3- с нагрузкой 
                          
                          //lv_obj_add_state(              butt_b[i], LV_STATE_CHECKED);                     //on
                              lv_obj_set_style_text_color(  butt_i[i], lv_color_hex(${butt_colr_ic_on}), LV_PART_MAIN);            // color1цвет иконки   1 желт
                              lv_obj_set_style_border_color(butt_b[i], lv_color_hex(${butt_colr_ic_on}), LV_PART_MAIN);            // color1 цвет контура  1 желт
                              if (sbut ==2){lv_obj_set_style_bg_color(butt_b[i], lv_color_hex(${butt_colr_bg_on}), LV_PART_MAIN);}  // color3 цвет конпки синий on                                                                   
                                       else{lv_obj_set_style_bg_color(butt_b[i], lv_color_hex(${butt_colr_bg_pw}), LV_PART_MAIN);}  // color2цвет конпки  красн power>5                     
                          } // красота по состяниям окончено
                    } // закончили отображать красоту          
                } // end for

