 #script,interval 
  script:
   #pg_updata:
    - id: update_dp1         # переменные для редактирования виджетов
      then:
        - lambda: |-     
             // 
               //int dp0=id(dp_0).state; int ax0=id(ax_0).state; int ay0=id(ay_0).state;
               //int dp1=id(dp_1).state; int ax1=id(ax_1).state; int ay1=id(ay_1).state;
                      
               //lv_obj_set_pos(id(lan_status), ax0, ay0);  
      #- - - - - - - - - - - - - - - -     
    - id: updata_updata
      then:
        - if:
            condition:
              lambda: |-
                return !lv_obj_has_flag(id(pg_main).obj, LV_OBJ_FLAG_HIDDEN);
            then:
              - script.execute: pg_main_update          
        - if:
            condition:
              lambda: |-
                return !lv_obj_has_flag(id(pg_voda).obj, LV_OBJ_FLAG_HIDDEN);
            then:
              - script.execute: pg_voda_update   
       
      #- - - - - - - - - - - - - - - - 
    - id: pg_main_update # температура управление котел
      then:
        - lambda: |-
            //               
              static char bufh[16];
              static char bufl[16];
              float p;            
            // показания температур
                // 
                  const int k=6;
                  const float err=-99;
                  static float s_tt[k]= {err+1,err+1,err+1,err+1,err+1,err+1};
                  static esphome::sensor::Sensor* sn_tt[]={   // temperature 
                                                    id(${main_tmrt_but1_tr}),
                                                    id(${main_tmrt_but2_tr}),
                                                    id(${main_tmrt_but3_tr}),
                                                    id(${main_kotl_but1_tr}), 
                                                    id(${main_kotl_but2_tr}), 
                                                    id(${main_kotl_but3_tr}),
                                                    };               
                  static lv_obj_t* lv_th[] = {                //                   
                                              id(main_tmrt_but1_th),
                                              id(main_tmrt_but2_th),
                                              id(main_tmrt_but3_th),
                                              id(main_kotl_but1_th),
                                              id(main_kotl_but2_th),                                
                                              id(main_kotl_but3_th),                                 
                                              }; 
                  static lv_obj_t* lv_tl[] = {                //                   
                                              id(main_tmrt_but1_tl),
                                              id(main_tmrt_but2_tl),
                                              id(main_tmrt_but3_tl),
                                              id(main_kotl_but1_tl),
                                              id(main_kotl_but2_tl),                                
                                              id(main_kotl_but3_tl),                                 
                                              };                     
             
                for(int i=0; i<k; i++){                 
                    if( isnan(sn_tt[i]->state) ){p=err;}
                      else{p=sn_tt[i]->state;}
                    if(s_tt[i]!=p){
                      s_tt[i]=p;
                      if(p==err){strcpy(bufh, "--"); strcpy(bufl, "-");}         
                          else{                
                            int ph=int(p); 
                            int pl=abs(int(10*p-10*ph));                    
                            snprintf(bufh, sizeof(bufh), "%i", ph);
                            snprintf(bufl, sizeof(bufl), "%i", pl);    
                          }
                      lv_label_set_text(lv_th[i], bufh ); 
                      lv_label_set_text(lv_tl[i], bufl); 
                    } // закрыли обновление печать              
                } // закрыли цикл 
            // состояния кнопок мотор1 мотор2 котел газ              
                //  
                  static int  but_st[]={0,0,0}; //0-err, 1-ok, 2-on, 3-power
                  //static bool but_sw[]={false,false,false,};
                  //static bool but_ln[]={false,false,false,};
                  static lv_obj_t* lv_b[] = {  // button  
                                            id(main_kotl_but1),
                                            id(main_kotl_but2),
                                            id(main_kotl_but3), 
                                            };
                  static lv_obj_t* lv_i[] = {  // icon 
                                            id(main_kotl_but1_ic),
                                            id(main_kotl_but2_ic),
                                            id(main_kotl_but3_ic), 
                                            };                
                  static esphome::homeassistant::HomeassistantBinarySensor* bt_sw[] = {  // switch       
                                    id(${main_kotl_but1_sw}),
                                    id(${main_kotl_but2_sw}),
                                    id(${main_kotl_but3_sw}),
                                  };  
                  static esphome::homeassistant::HomeassistantBinarySensor* bt_ln[] = {  // line status  
                                    id(${main_kotl_but1_ln}),
                                    id(${main_kotl_but2_ln}),
                                    id(${main_kotl_but3_ln}),
                                  };
                  static esphome::homeassistant::HomeassistantSensor*       bt_pw[] = {  // power       
                                    id(${main_kotl_but1_pw}),
                                    id(${main_kotl_but2_pw}),
                                    id(${main_kotl_but3_pw}),
                                  };                            
                  lv_color_t colr_bg;
                  lv_color_t colr_ic;
                  lv_color_t colr_bd;
                  int ss;
                
                for(int i=0; i<3; i++){
                    ss=1;                               // 1-off
                  if(!bt_ln[i]->state){ss=0;}          // 0-err
                    else{       
                      if(bt_sw[i]->state){ss=2;        // 2-ON
                          if(bt_pw[i]->state>5){ss=3;}  // 3-power
                        }
                  } 
                  if(but_st[i]!= ss){
                      but_st[i] = ss;
                      ESP_LOGI("ss", "but ss: %d",ss); 
                      if(ss==0){     colr_bg= lv_color_hex(${main_kotl_but_colr_bg});
                                    colr_ic= lv_color_hex(${main_kotl_but_colr_ic_er}); 
                                    colr_bd= lv_color_hex(${main_kotl_but_colr_bd_er});
                      } 
                      else if(ss==1){colr_bg= lv_color_hex(${main_kotl_but_colr_bg});
                                    colr_ic= lv_color_hex(${main_kotl_but_colr_ic});
                                    colr_bd= lv_color_hex(${main_kotl_but_colr_bd});
                      }
                      else if(ss==2){colr_bg= lv_color_hex(${main_kotl_but_colr_bg_on});
                                    colr_ic= lv_color_hex(${main_kotl_but_colr_ic});
                                    colr_bd= lv_color_hex(${main_kotl_but_colr_bd_on});
                      }
                      else{          colr_bg= lv_color_hex(${main_kotl_but_colr_bg_pw});
                                    colr_ic= lv_color_hex(${main_kotl_but_colr_ic});
                                    colr_bd= lv_color_hex(${main_kotl_but_colr_bd_on});
                      }
                      lv_obj_set_style_text_color(  lv_i[i], colr_ic, LV_PART_MAIN); // 
                      lv_obj_set_style_bg_color(    lv_b[i], colr_bg, LV_PART_MAIN); // 
                      lv_obj_set_style_border_color(lv_b[i], colr_bd, LV_PART_MAIN); //
                  }// new
                } // for
                  
      #- - - - - - - - - - -  - - - - -  - - - - -  -
    - id: pg_voda_update
      then:  
        - lambda: |-
             //
              // boiler  
                static int bt_st[]={0,0,0,0,0,0,0,0}; // 0-err,1-off,2-on
                static int bt_pwl[]={-99,-99,-99,-99,-99,-99,-99,-99};
                static char buf[16];
                int st;
                lv_color_t colr_bg;                
                lv_color_t colr_bd;                 
                lv_color_t colr_nm;                
                lv_color_t colr_ic;
                lv_color_t colr_pw;
                
                static lv_obj_t* lv_bt[] = {              // butt
                                          id(voda_but1),
                                          id(voda_but2),                           
                                           };                
                
                static lv_obj_t* lv_ic[] = {               // icon
                                          id(voda_but1_ic),
                                          id(voda_but2_ic),
                                           };                          
                
                static lv_obj_t* lv_nm[] = {               // name
                                          id(voda_but1_nm),
                                          id(voda_but2_nm),
                                           };                
                
                static lv_obj_t* lv_pw[] = {               // power
                                          id(voda_but1_pw),
                                          id(voda_but2_pw),
                                           };                
                
                static esphome::homeassistant::HomeassistantBinarySensor* bt_sw[]={  //switch   
                                          id(${voda_but1_sw}),
                                          id(${voda_but2_sw}),
                                         };      
                static esphome::homeassistant::HomeassistantSensor*  bt_pw[]={        // power
                                          id(${voda_but1_pw}),
                                          id(${voda_but2_pw}),             
                                          };               
                static esphome::homeassistant::HomeassistantBinarySensor*  bt_ln[]={  // online
                                          id(${voda_but1_ln}),
                                          id(${voda_but2_ln}),
                                          };             
             
               // 
                for(int i=0; i<2; i++){
                      st=1;                            // 1-off svet
                    
                    if(!bt_ln[i]->state){st=0;}           // 0-err
                      else{       
                        if(bt_sw[i]->state){st=2;         // 2-ON
                            if(bt_pw[i]->state>5){st=3;}  // 3-power
                          }
                    } 
                    if(bt_st[i]!=st){
                     ESP_LOGI("ts", "but boiler st: %d",st);
                        bt_st[i]=st; 
                        if(st==0){     colr_bg=lv_color_hex(${voda_but_colr_bg_er});          //err
                                       colr_bd=lv_color_hex(${voda_but_colr_bd_er}); 
                                       colr_nm=lv_color_hex(${voda_but_colr_nm_er}); 
                                       colr_ic=lv_color_hex(${voda_but_colr_ic_er});
                                       colr_pw=lv_color_hex(${voda_but_colr_pw_of});}  
                        else if(st==1){colr_bg=lv_color_hex(${voda_but_colr_bg_of});          // off
                                       colr_bd=lv_color_hex(${voda_but_colr_bd_of}); 
                                       colr_nm=lv_color_hex(${voda_but_colr_nm_of}); 
                                       colr_ic=lv_color_hex(${voda_but_colr_ic_of});
                                       colr_pw=lv_color_hex(${voda_but_colr_pw_of});}                            
                        else if(st==2){colr_bg=lv_color_hex(${voda_but_colr_bg_on});      // on         
                                       colr_bd=lv_color_hex(${voda_but_colr_bd_on}); 
                                       colr_nm=lv_color_hex(${voda_but_colr_nm_on}); 
                                       colr_ic=lv_color_hex(${voda_but_colr_ic_on});
                                       colr_pw=lv_color_hex(${voda_but_colr_pw_on});}                        
                        else{          colr_bg=lv_color_hex(${voda_but_colr_bg_pw});      // power          
                                       colr_bd=lv_color_hex(${voda_but_colr_bd_pw}); 
                                       colr_nm=lv_color_hex(${voda_but_colr_nm_pw}); 
                                       colr_ic=lv_color_hex(${voda_but_colr_ic_pw});
                                       colr_pw=lv_color_hex(${voda_but_colr_pw_on});}                             
                          
                        lv_obj_set_style_bg_color(    lv_bt[i], colr_bg, LV_PART_MAIN); // 
                        lv_obj_set_style_border_color(lv_bt[i], colr_bd, LV_PART_MAIN); // 
                        lv_obj_set_style_text_color(  lv_nm[i], colr_nm, LV_PART_MAIN); //                         
                        lv_obj_set_style_text_color(  lv_ic[i], colr_ic, LV_PART_MAIN); // 
                        lv_obj_set_style_text_color(  lv_pw[i], colr_pw, LV_PART_MAIN); //                     
                    }
                    if(bt_pwl[i]!= bt_pw[i]->state ){
                       bt_pwl[i] = bt_pw[i]->state;                       
                       snprintf(buf, sizeof(buf), "%i w", bt_pwl[i]);
                       lv_label_set_text(lv_pw[i], buf);
                    } 
                } 
               //
              // KPAHi
                static int bt_ks[]={-1,-1,-1}; // 0-err,1-open,2-close
                static const char* i_open   = "${valve_open}";
                static const char* i_closed = "${valve_closed}";
                static const char* i_offln  = "${lan_disconnect}";
                const char* i_lv ;
                lv_color_t colr_ic2;
                int ks;                
                static lv_obj_t* lv_ki[] = {               // icon
                                          id(voda_but5_ic),
                                          id(voda_but6_ic),
                                          id(voda_but7_ic),
                                           };
                static lv_obj_t* lv_kb[] = {               // but
                                          id(voda_but5),
                                          id(voda_but6),
                                          id(voda_but7),
                                           };
                static esphome::homeassistant::HomeassistantBinarySensor* vk_st[]={  // binary_sensor.z2_vkx_status   
                                  id(${voda_but5_st}),
                                  id(${voda_but6_st}),
                                  id(${voda_but7_st}),
                                  };                 
                static esphome::homeassistant::HomeassistantBinarySensor* vk_ln[]={  // online   
                                  id(${voda_but5_ln}),
                                  id(${voda_but6_ln}),
                                  id(${voda_but7_ln}),
                                  };                 
                
                                                                    
               //
                 for(int i=0; i<3; i++){
                  
                  if(!vk_ln[i]->state){ks=0;}
                    else {ks = vk_st[i]->state ? 1 : 2;}
                      
                  
                  //if(!vk_ln[i]->has_state()){
                  //    ks = 0;
                  //} else if(vk_ln[i]->state){
                  //    ks = vk_st[i]->state ? 1 : 2;
                  //} else {
                  //    ks = 0;
                  //}
                    
                   
                   if(bt_ks[i]!=ks){
                      bt_ks[i] =ks;

                      if(ks==1){
                         i_lv=i_open;
                         colr_ic2=lv_color_hex(${voda_but_colr_ic2_on}); 
                      }                                       
                      if(ks==2){
                         i_lv=i_closed; //
                         colr_ic2=lv_color_hex(${voda_but_colr_ic2_of});
                      }                                    
                      if(ks==0){
                      i_lv=i_offln; //
                      colr_ic2=lv_color_hex(${voda_but_colr_ic2_er});
                      }
                      lv_label_set_text(lv_ki[i], i_lv);
                      lv_obj_set_style_text_color(  lv_ki[i], colr_ic2, LV_PART_MAIN);                   
                   }           
                 }
      
