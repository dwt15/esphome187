      key: "iF4MoEeKRTbnBJu7B3cVzXrZz6jJ4qXlkYbRAj/MSgY="
   #- - - - - - - - - - - - - - - - - - -   
  ota:
    platform: esphome
    password: "ce713529f09801d0486b69a22f7921f3"
   #- - - - - - - - - - - - - - - - - - -   
  wifi:
    id: wifi_component
    ssid: !secret wifi_ssid
    password: !secret wifi_password
    on_connect:
      - script.execute: update_net_status
    on_disconnect:
      - script.execute: update_net_status
