 #set: output, spi,one_wire ,touch, display,  time 
  debug:  
  output:   # 2 яркость экрана
    - platform: ledc
      pin: ${pin_dsp_ld} # 2   # яркость
      id: led_dsp
    - platform: ledc   # led red
      pin: ${pin_led_red}
      id: led_red 
    - platform: ledc   # led gren
      pin: ${pin_led_grn}
      id: led_grn 
    - platform: ledc   # led blue
      pin: ${pin_led_blu}
      id: led_blu   
    - platform: ledc  # бузер     
      pin: ${pin_rtttl}
      id: rtttl_out   
   #- - - - - - - - - - - - - - - - - - -
  rtttl:
      output: rtttl_out
      id: my_rtttl
      gain: 1%  
  spi:
    - id: spi_display 
      clk_pin:  ${pin_spi0_clk}   #14
      mosi_pin: ${pin_spi0_mosi}  #13
      #miso_pin: ${pin_spi0_miso}  #12
    - id: spi_touch 
      clk_pin:  ${pin_spi1_clk}   #25
      mosi_pin: ${pin_spi1_mosi}  #32
      miso_pin: ${pin_spi1_miso}  #39
   #- - - - - - - - - - - - - - - - - - -
  one_wire: # dallas
    - platform: gpio
      pin: ${pin_one_wire} #27
  touchscreen:
    platform: xpt2046
    id: my_touch
    spi_id: spi_touch
    cs_pin: ${pin_touch_sc} #33
    calibration:
      x_min: 200  # L:200    R:200 
      x_max: 3830  # L:3830  R:3830 
      y_min: 170  # L:170    R:170
      y_max: 3780 # L:3780   R:3780
    transform:
      swap_xy: true #  L:true  R:true
      mirror_x: true # L:true  R:false
      mirror_y: true # L:true  R:false
    on_touch:
       - lambda: |-
             ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
                 touch.x,
                 touch.y,
                 touch.x_raw,
                 touch.y_raw
                 );  
   #- - - - - - - - - - - - - - - 
  display:
    - platform: mipi_spi #ili9xxx
      model: ESP32-2432S028 #ILI9341 #TFT 2.4
      id: my_display     
      spi_id: spi_display
      cs_pin: ${pin_dsp_cs} #15   
      dc_pin: ${pin_dsp_dc} #2  
      invert_colors: false    
      #color_palette: 8BIT    
      color_order: rgb
      transform:      
        mirror_x: true #  L:true   R:false 
        mirror_y: false # L:false  R:true 
        swap_xy: false # L:false   R:false
      dimensions:
        height: 240
        width: 320     
    #    update_interval: 5s 
  time:
    - platform: sntp
      id: my_time
      timezone: "Europe/Kyiv"
      servers:
        - 0.pool.ntp.org
        - 1.pool.ntp.org
        - 2.pool.ntp.org
      update_interval: 3600s
      on_time:
        - seconds: /1  # каждую секунду
          then:
            - lambda: |-
                //
                  auto now = id(my_time).now();
                  if (!now.is_valid()) return;
                  static int last_sec = -1;
                  static int last_min = -1;
                  static int last_hour = -1;
                  static int last_day = -1;
                  static int last_month = -1;
                  static int last_wday = -1;    
                  int sec = now.second;
                  int min = now.minute;
                  int hour = now.hour;
                  int day = now.day_of_month;
                  int month = now.month;
                  int wday = now.day_of_week;  // 0 = воскресенье, 1 = понедельник ...
                  char buf[20];
                // СЕКУНДЫ   {time_t3}
                  if (sec != last_sec) {
                    last_sec = sec;
                    snprintf(buf, sizeof(buf), "%02d", sec);
                    lv_label_set_text(id(top_time_sec), buf);
                  }
                // МИНУТЫ + ЧАСЫ
                  
                  if (min != last_min) {
                    last_min = min;
                    snprintf(buf, sizeof(buf), "%2d:%02d", hour,  min);
                    lv_label_set_text(id(top_time_hour_min), buf);
                  }

