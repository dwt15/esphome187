   #flash:
    - id: chek_fflash123456
      then:
        - lambda: |-
               id(f_flash)[1] = (id(${f_flash1_s1}).state < ${f_flash1_tr}) && (id(${${f_flash1_s2}}).state); // котел горелка газ
               id(f_flash)[2] = false;                                                                        // котел горелка газ
               
               id(f_flash)[3] = (id(${f_flash3_s1}).state > ${f_flash3_tr});  // морозилка целіе
               id(f_flash)[4] = false;                                        // морозилка десят                                                                     
               
               id(f_flash)[5] = (id(${f_flash5_s1}).state) && (!id(${${f_flash5_s2}}).state );     // бойлер1 автомат вкл и розетка выкл        
               id(f_flash)[6] = (id(${f_flash6_s1}).state) && (!id(${${f_flash6_s2}}).state );     // бойлер1 автомат вкл и розетка выкл      
               
               id(f_flash)[7] = (!id(${f_flash7_s1}).state);  // кран главній     потеря связи
               id(f_flash)[8] = (!id(${f_flash8_s1}).state);  // кран бойлер      потеря связи
               id(f_flash)[9] = (!id(${f_flash9_s1}).state);  // кран холдна вода потеря связи
      #- - - - - - - -  - - - - - - - - - - - - - -     
    - id: flash_err
      then:
        - lambda: |-
            //        
                static bool phase = false;
                const int k=10;
                phase = !phase;       
                static lv_obj_t* lv_lb[] = {              //                   
                                            id(${f_flash0_lv}),    // 0 lan connect
                                            id(${f_flash1_lv}),    // 1 kotel gas tr цел
                                            id(${f_flash2_lv}),    // 2 kotel gas tr дес                         
                                            id(${f_flash3_lv}),    // 3 morozilka   цел
                                            id(${f_flash4_lv}),    // 4 morozilka   дес                                         
                                            id(${f_flash5_lv}),    // 5 boiler1
                                            id(${f_flash6_lv}),    // 6 boiler2 
                                            id(${f_flash7_lv}),    // 7 kran vk0 гл 
                                            id(${f_flash8_lv}),    // 8 kran vk1 бойлер
                                            id(${f_flash9_lv}),    // 9 kran vk2 холдная вода
                                            };                
                
                for(int i=0; i<k; i++){
                  if (id(f_flash)[i] ) {
                      if (phase){lv_obj_add_flag(lv_lb[i], LV_OBJ_FLAG_HIDDEN);}                 
                       else {  lv_obj_clear_flag(lv_lb[i], LV_OBJ_FLAG_HIDDEN); }   
                  } else {     lv_obj_clear_flag(lv_lb[i], LV_OBJ_FLAG_HIDDEN);} 
                                      
                }      
      
      #- - - - - - - -  - - - - - - - - - - - - - - 

    - id: update_net_status
      then:
        - lambda: |-
              
              if (!id(wifi_component).is_connected()) {
                // 🔴 нет Wi-Fi
                lv_obj_set_style_text_color(id(lan_status), lv_color_hex(0xFF00FF), 0);
                lv_label_set_text(id(lan_status), "${wifi_off}");
                id(f_flash)[0]=true; // 
              } else if (!id(ha_connected).state) {
                // 🟡 Wi-Fi есть, HA нет
                lv_obj_set_style_text_color(id(lan_status), lv_color_hex(0xFFFF00), 0);
                lv_label_set_text(id(lan_status), "${lan_disconnect}");
                id(f_flash)[0]=true; // 
              } else {
                // 🟢 всё ок
                lv_obj_set_style_text_color(id(lan_status), lv_color_hex(0x303020), 0);
                lv_label_set_text(id(lan_status), "${lan_connect}");
                id(f_flash)[0]=false; // 
              }
    - id: timer
      then:
        - lambda: |-
             //                         
               static char buf[20];
              
              // timer1  при старте показывает страницу sysinfo 
                    const int t1=10;                                                  
                  // віполнить при старте
                      if(id(f_timer)[1]){                            
                        id(f_timer)[1]=false;
                        id(timer1) = t1;                                               //                      
                        lv_scr_load(id(pg_sysi).obj);
                      }                 
                  // выполнять в процессе 
                      if(id(timer1) > 0){                                
                        id(timer1)--;
                      }
                  // віполнять в конце
                      if(id(timer1) == 0){             
                        id(timer1) = -1;                                                //                   
                        lv_scr_load(id(pg_main).obj);
                      }                

              
              // timer2  при закр/отк крана Главный 
                    const int t2=20;                                                  
                  // віполнить при старте
                      if(id(f_timer)[2]){                            
                        id(f_timer)[2]=false;
                        id(timer2) = t2;                                               //                                         
                      }                 
                      if(id(timer2) >= 0){                                             
                          if(id(timer2) > 0){   // выполнять в процессе                                
                              id(timer2)--;
                              snprintf(buf, sizeof(buf), "%d", id(timer2));                      
                              lv_label_set_text(id(voda_but5_tm), buf);                     
                              
                            }else{             // віполнять в конце                                                                                
                              snprintf(buf, sizeof(buf), "%d", t2);
                              lv_label_set_text(id(voda_but5_tm), buf);  
                              id(timer2) = -1;                                                //                                    
                          }                       
                      }              

              // timer3  при закр/отк крана Бойлер 
                    const int t3=20;                                                  
                  // віполнить при старте
                      if(id(f_timer)[3]){                            
                         id(f_timer)[3]=false;
                         id(timer3) = t3;                                               //                                         
                      }                 
                      if(id(timer3) >= 0){                                             
                          if(id(timer3) > 0){              // выполнять в процессе                                
                             id(timer3)--;
                             snprintf(buf, sizeof(buf), "%d", id(timer3));                      
                             lv_label_set_text(id(voda_but6_tm), buf);                                                   
                           }else{                            // віполнять в конце                                                                                
                             snprintf(buf, sizeof(buf), "%d", t3);
                             lv_label_set_text(id(voda_but6_tm), buf);
                             id(timer3) = -1;                                                //                                    
                          }                       
                      }
              
              // timer4  при закр/отк крана Холодна Вода
                    const int t4 = 20;                                                  
                  // віполнить при старте
                      if(id(f_timer)[4]){                            
                         id(f_timer)[4] = false;
                         id(timer4) = t4;                                               //                                         
                      }                 
                      if(id(timer4) >= 0){                                             
                          if(id(timer4) > 0){   // выполнять в процессе                                
                             id(timer4)--;
                             snprintf(buf, sizeof(buf), "%d", id(timer4));                      
                             lv_label_set_text(id(voda_but7_tm), buf);                                                  
                           }else{             // віполнять в конце                                                                                
                             snprintf(buf, sizeof(buf), "%d", t4); 
                             lv_label_set_text(id(voda_but7_tm), buf);
                             id(timer4) = -1;                                                //                                    
                          }                       
                      }      
