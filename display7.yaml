 # set: esphome, esp32, logger, api, ota, wifi img_snowy
  esphome:
    name: display7
    friendly_name: display7
    comment: "Котельна  температур" 
    on_boot:
      priority: -100
      then:
        - output.turn_on: led_dsp
        - output.turn_on: led_red
        - output.turn_on: led_grn
        - output.turn_on: led_blu
        - rtttl.play: ${beep1}  
   #- - - - - - - - - - - - - - - - - - -      
  esp32:
    board: esp32dev
    framework:
      type: esp-idf
      advanced:
        minimum_chip_revision: "3.1"    
        sram1_as_iram: true
   #- - - - - - - - - - - - - - - - - - -   
  logger:
   #- - - - - - - - - - - - - - - - - - -   
  api:
