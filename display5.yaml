remote_receiver:
  pin: ${pin_433} #22
  #dump: raw #raw #all
  # Settings to optimize recognition of RF devices
  tolerance: 15%
  filter: 420us #450us # 420us  #
  idle: 6ms #7ms
  buffer_size: 2kb # only for ESP8266    

  on_raw:
    then:
      - lambda: |-
          std::vector<int> binary_data;
           float temperature_f;
           int humidity;
           int temperature;
           for (auto& pulse : x) {
            if (pulse < -1800 && pulse > -2200) { // 2 мс -> 0
              binary_data.push_back(0);
            } else if (pulse < -3800 && pulse > -4200) { // 4 мс -> 1
              binary_data.push_back(1);
            }
          }
          
          // Вывод массива в лог
          std::string binary_string;
          int bit;
          int ch;
          int i=0;
          for (auto bit : binary_data) {
           i=i+1; binary_string += std::to_string(bit);
          }
          
          if (i == 36 ){
               //               // 0
                //id(led_blue).turn_on();
                id(led_b).turn_off();
                int s=0;     
                if(binary_string[0] == '1'){s=s+1;}                     
                if(binary_string[1] == '1'){s=s+2;} 
                if(binary_string[2] == '1'){s=s+4;} 
                if(binary_string[3] == '1'){s=s+8;} 
                   // 1
                if(binary_string[4] == '1'){s=s+1;}                     
                if(binary_string[5] == '1'){s=s+2;} 
                if(binary_string[6] == '1'){s=s+4;} 
                if(binary_string[7] == '1'){s=s+8;}                
                   // 2   
                if(binary_string[8]  == '1'){s=s+1;}                     
                if(binary_string[9]  == '1'){s=s+2;} 
                if(binary_string[10] == '1'){s=s+4;} 
                if(binary_string[11] == '1'){s=s+8;} 
                   // 3  
                if(binary_string[12] == '1'){s=s+1;}                     
                if(binary_string[13] == '1'){s=s+2;} 
                if(binary_string[14] == '1'){s=s+4;} 
                if(binary_string[15] == '1'){s=s+8;} 
                   // 4
                if(binary_string[16] == '1'){s=s+1;}                     
                if(binary_string[17] == '1'){s=s+2;} 
                if(binary_string[18] == '1'){s=s+4;} 
                if(binary_string[19] == '1'){s=s+8;} 
                   // 5
                if(binary_string[20] == '1'){s=s+1;}                     
                if(binary_string[21] == '1'){s=s+2;} 
                if(binary_string[22] == '1'){s=s+4;} 
                if(binary_string[23] == '1'){s=s+8;} 
                   // 6
                if(binary_string[24] == '1'){s=s+1;}                     
                if(binary_string[25] == '1'){s=s+2;} 
                if(binary_string[26] == '1'){s=s+4;} 
                if(binary_string[27] == '1'){s=s+8;} 
                   // 7
                if(binary_string[28] == '1'){s=s+1;}                     
                if(binary_string[29] == '1'){s=s+2;} 
                if(binary_string[30] == '1'){s=s+4;} 
                if(binary_string[31] == '1'){s=s+8;} 
                   // 8
                if(binary_string[32] == '1'){s=s+1;}                     
                if(binary_string[33] == '1'){s=s+2;} 
                if(binary_string[34] == '1'){s=s+4;} 
                if(binary_string[35] == '1'){s=s+8;} 
           if (s == 31 or s == 47 or s == 63 ){
              // chanel
               bit=binary_string[5] - '0';ch=bit;
               bit=binary_string[4] - '0';ch=ch+bit*2; 
               if(ch==0){ch=3;}             
              // humidity
               bit=binary_string[28] - '0';humidity=bit;
               bit=binary_string[29] - '0';humidity=humidity+bit*2;
               bit=binary_string[30] - '0';humidity=humidity+bit*4;
               bit=binary_string[31] - '0';humidity=humidity+bit*8;
               humidity=humidity*10;
               bit=binary_string[24] - '0';humidity=humidity+bit;
               bit=binary_string[25] - '0';humidity=humidity+bit*2;
               bit=binary_string[26] - '0';humidity=humidity+bit*4;
               bit=binary_string[27] - '0';humidity=humidity+bit*8;             
              // temperature
               bit=binary_string[12] - '0'; temperature=bit;
               bit=binary_string[13] - '0'; temperature=temperature+bit*2;
               bit=binary_string[14] - '0'; temperature=temperature+bit*4;               
               bit=binary_string[15] - '0'; temperature=temperature+bit*8;               
               bit=binary_string[16] - '0'; temperature=temperature+bit*16;               
               bit=binary_string[17] - '0'; temperature=temperature+bit*32;               
               bit=binary_string[18] - '0'; temperature=temperature+bit*64;
               bit=binary_string[19] - '0'; temperature=temperature+bit*128; 
               bit=binary_string[20] - '0'; temperature=temperature+bit*256;
               
               if(binary_string[21] - '0'){temperature=temperature-512;}
               temperature_f = temperature;
               temperature_f = temperature_f/10;
               
               if (ch==1){
                   if(binary_string[0] == '1'){
                        id(temperature_1a).publish_state(temperature_f);
                        id(humidity_1a).publish_state(humidity);
                        id(time_c1a)=0;
                        id(time_1a).publish_state(id(time_c1a));                  
                        id(ch1_433).execute(); 
                   }else{                   
                        id(temperature_1).publish_state(temperature_f);
                        id(humidity_1).publish_state(humidity);
                        id(time_c1)=0;
                        id(time_1).publish_state(id(time_c1));
               }}
               if (ch==2){
                   id(temperature_2).publish_state(temperature_f);  
                   id(humidity_2).publish_state(humidity);
                   id(time_c2)=0;
                   id(time_2).publish_state(id(time_c2));               
                   id(ch2_433).execute(); 
               }
               if (ch==3){
                   id(temperature_3).publish_state(temperature_f); 
                   id(humidity_3).publish_state(humidity);
                   id(time_c3)=0;
                   id(time_3).publish_state(id(time_c3));                    
                   id(ch3_433).execute();
               }
               
              //ESP_LOGD("RF_DECODER", "Decoded bits: '%s --", binary_string.c_str());
              // ESP_LOGD("RF_DECODER", "Decoded  ch: %i , t=%.1f°C , h=%i %%%", ch,temperature_f, humidity);
              //id(led_blue).turn_on();
             
            delay(1);  // Задержка 0.1 секунды
            //id(led_blue).turn_off();
             id(led_b).turn_on();
           }            
           else {ESP_LOGD("RF_DECODER", "Decoded bits: %s '", binary_string.c_str());}  
          } 

