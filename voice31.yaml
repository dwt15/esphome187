  esphome:
    name: voice31
    friendly_name: voice31

  esp32:
    board: esp32-s3-devkitc-1
    flash_size: 4MB
    framework:
      type: esp-idf
      sdkconfig_options:
        CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
        CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
        CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
        CONFIG_AUDIO_BOARD_CUSTOM: "y"

  psram:
    mode: quad  # quad for N8R2 and octal for N16R8
    speed: 80MHz

  # Enable logging
  logger:

  # Enable Home Assistant API
  api:
    encryption:
      key: "4xYuEOr30n5MdCsWf+EMRsYoop1X7Cag/g1ZoOn5v98="

    on_client_connected:
          then:
            - delay: 50ms
            - light.turn_off: led_ww
            - micro_wake_word.start:
    on_client_disconnected:
          then:
            - voice_assistant.stop:


  ota:
    - platform: esphome
      password: "2e7396dfd9a9f3b406df081ba6b6b5b5"

  wifi:
    use_address: 192.168.0.180
    ssid: !secret wifi_ssid
    password: !secret wifi_password

    # Enable fallback hotspot (captive portal) in case wifi connection fails
    ap:
      ssid: "Voice31 Fallback Hotspot"
      password: "loDl3TCc1wgb"

  captive_portal:

#setup
  substitutions:  
   #pin
    #i2s 
     #mic
     pin_i2s_mic_sck:  7  # sck
     pin_i2s_mic_ws:   9  # ws 
     pin_i2s_mic_sd:   8  # sd   
     #speak
     pin_i2s_spk_bclk: 5  # bclk
     pin_i2s_spk_lrc:  6  # lrc 
     pin_i2s_spk_din:  4  # din

#dev
  i2s_audio:
    - id: i2s_mic
      i2s_lrclk_pin: ${pin_i2s_mic_ws}    #WS
      i2s_bclk_pin:  ${pin_i2s_mic_sck}   #SCK
    - id: i2s_spk
      i2s_lrclk_pin: ${pin_i2s_spk_lrc}   #LRC
      i2s_bclk_pin:  ${pin_i2s_spk_bclk}  #BLCK     

  microphone:
    - platform: i2s_audio
      id: va_mic
      adc_type: external
      i2s_din_pin: ${pin_i2s_mic_sd}  #SD pin on the INMP441
      channel: left
      
      pdm: false
      
      


      i2s_audio_id: i2s_mic
      bits_per_sample: 32bit

  speaker:
      platform: i2s_audio
      id: va_speaker
      i2s_audio_id: i2s_spk
      dac_type: external
      i2s_dout_pin: ${pin_i2s_spk_din}  #  DIN Pin of the MAX98357A Audio Amplifier
      channel: mono     


  button:
    - platform: restart
      name: "Restart"
      id: but_rest

  switch:
    - platform: template
      id: mute
      name: mute
      optimistic: true
      on_turn_on:
        - micro_wake_word.stop:
        - voice_assistant.stop:
        - light.turn_on:
            id: led_ww
            red: 100%
            green: 0%
            blue: 0%
            brightness: 60%
            effect: fast pulse
        - delay: 2s
        - light.turn_off:
            id: led_ww
        - light.turn_on:
            id: led_ww
            red: 100%
            green: 0%
            blue: 0%
            brightness: 30%
      on_turn_off:
        - micro_wake_word.start:
        - light.turn_on:
            id: led_ww
            red: 0%
            green: 100%
            blue: 0%
            brightness: 60%
            effect: fast pulse
        - delay: 2s
        - light.turn_off:
            id: led_ww

  light:
    - platform: esp32_rmt_led_strip
      id: led_ww
      rgb_order: RGB
      pin: GPIO21
      num_leds: 1
      #rmt_channel: 0
      chipset: ws2812
      name: "on board light"
      effects:
        - pulse:
        - pulse:
            name: "Fast Pulse"
            transition_length: 0.5s
            update_interval: 0.5s
            min_brightness: 0%
            max_brightness: 100%  

  micro_wake_word:
    on_wake_word_detected:
      # then:
      - voice_assistant.start:
          wake_word: !lambda return wake_word;
      - light.turn_on:
          id: led_ww
          red: 30%
          green: 30%
          blue: 70%
          brightness: 60%
          effect: fast pulse
    models:
      - model: okay_nabu # alexa # 

  voice_assistant:
    id: va
    microphone: va_mic
    #microphone:
    #  microphone: va_mic
    #  channels: 0
    #  gain_factor: 5
    noise_suppression_level: 2 #2.0
    volume_multiplier: 4.0 #4.0
    
    speaker: va_speaker
    on_stt_end:
        then:
          - light.turn_off: led_ww
    on_error:
            - micro_wake_word.start:
    on_end:
          then:
            - light.turn_off: led_ww
            - wait_until:
                not:
                  voice_assistant.is_running:
            - micro_wake_word.start:     


  sensor:
   # sysi     
    - platform: template
      name: "Free "
    #  id: free_memory
      unit_of_measurement: "B"
      update_interval: 20s  
      lambda: |-
        return heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);

    - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
      name: "WiFi Signal dB"
      id: wifi_signal_db
      entity_category: "diagnostic"
      update_interval: 30s    

  text_sensor:
    - platform: version
      name: "ESPHome Version"
      id: esphome_version
              
    - platform: template      # esphome_name
      name: "esphome name"
      id: esphome_name
      lambda: |-
         return App.get_name();
    
    - platform: wifi_info     # wifi
      ip_address:
        name: "IP Address"
        id: ip_adress                    
      ssid:
        name: "Connected SSID"
        id: connected_ssid
      bssid:
        name: "BSSID"
        id: bssid
      mac_address:
        name: "MAC Address"
        id: mac_address
  