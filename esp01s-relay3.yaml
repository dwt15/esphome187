esphome:
  name: esp01s-relay3
  friendly_name: esp01s-relay3

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "iaX7T+KvLsj6ZWvg2n/VgbGz5JqApyChfZAyeelh3Mw="

ota:
  - platform: esphome
    password: "6c29ed418352862c6535f6fc7cc66a58"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp01S-Relay3 Fallback Hotspot"
    password: "rVYP4McMg3Kt"

captive_portal:

switch:
  - platform: gpio
    pin: 0
    name: "Relay"
    id: relay_switch     
    restore_mode: ALWAYS_ON

text_sensor:
   #sys
    - platform: version
      name: "ESPHome Version"
      id: esphome_version

    - platform: template      # esphome_name
      name: "esphome name"
      id: esphome_name
      lambda: |-
         return App.get_name();
    
      # - - - - - - - - - - - - - -  
    - platform: wifi_info     # wifi
      ip_address:
        name: "IP Address"
        id: ip_adress
    
      ssid:
        name: "Connected SSID"
        id: connected_ssid
      bssid:
        name: "BSSID"
        id: bssid
      mac_address:
        name: "MAC Address"
        id: mac_address

sensor:
    - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
      name: "WiFi Signal dB"
      id: wifi_signal_db
      entity_category: "diagnostic"
      update_interval: 30s 