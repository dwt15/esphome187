  esphome:
    name: battery03
    friendly_name: battery03
    comment: "Monitor JK-BMS 480x320 env305" 
    on_boot:
      priority: 600
      then:     
        - output.turn_on: led_tft
        - output.turn_on: led_red
        - output.turn_on: led_grn
        - output.turn_on: led_blu
