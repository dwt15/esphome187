                else if(c_def <= 50   ){m_def = 50;   k_def=5;}    // размер шкалы                
                else if(c_def <= 100  ){m_def = 60;   k_def=5;}    // размер шкалы                               
                // вычисляем макс показание шкалы 
                if(c_def == 0){g_max = d_max+0.03;}
                else if(c_def == m_def){g_max = d_max;}
                      else{                        
                       p = d_max/k_def;
                       if(p>0){ p = p + 1;}
                       g_max = k_def*int(p);
