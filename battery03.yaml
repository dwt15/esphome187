      - id: grafm_page
        scrollbar_mode: "ACTIVE"  # показывать полосу прокрутки при прокрутке 
        scrollable: 'true'        # можно прокручивать страницу
        widgets:
          - obj: #grafm_obj
              id: grafm_obj
              x: "${grafm_wbx}"  # pos x
              y: "${grafm_wby}"  # pos y
              width:  "${grafm_wdx}" #  ширина по x
              height: "${grafm_wdy}"  # высота по y                           
              bg_color: 0x000000      
              border_color: 0x00f000
              border_width: 1
              shadow_width: 0
              radius: 0
              pad_all: 0
              align: TOP_LEFT
              scrollbar_mode: "ACTIVE"  # показывать полосу прокрутки при прокрутке 
              scrollable: 'false'        # можно прокручивать страницу            
              widgets:
                - button: # "Voltage,V"
                    id: grafm_but1
                    x: 70
                    y: 1
                    styles: style_grafm_buts
                    pressed:
                      bg_color: 0xf0f0f0
                    on_click:
                      then:
                        - delay: 100ms
                        - lambda: |-                 
                            id(my_rtttl).play("${beep1}");
                            lv_obj_set_style_bg_color(id(grafm_but1),lv_color_make(255, 0,  0), LV_PART_MAIN);
                            lv_obj_set_style_bg_color(id(grafm_but2),lv_color_make(  0, 0, 64), LV_PART_MAIN);
                            lv_obj_set_style_bg_color(id(grafm_but3),lv_color_make(  0, 0, 64), LV_PART_MAIN);                         
