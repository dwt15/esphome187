           // 
              auto now = id(my_time).now();
              static int g_timep[] = {0, 60, 120, 180, 240,  300,  360,  420,  480,  540,  600,  660,  720,
                                        780, 840, 900, 960, 1020, 1080, 1140, 1200, 1260, 1320, 1380, 1439};
