#set: external_components, output, spi, touch, display, rtttl, uart, jk_modbus, jk-bms, time 
  external_components:
        #- source: github://syssi/esphome-jk-bms@main # ${external_components_source}
        #  refresh: 60s
     - source:
         type: local     
         path: components/jk-bms
   # - - - - - - - - - - - - - - -  - -
  output:
    - platform: ledc   # led_tft
      pin: ${pin_dsp_ld}
      id: led_tft  
    - platform: ledc   # led red
      pin: ${pin_led_red}
      id: led_red 
    - platform: ledc   # led gren
      pin: ${pin_led_grn}
      id: led_grn 
    - platform: ledc   # led blue
      pin: ${pin_led_blu}
      id: led_blu
    - platform: ledc   # buzzer
      pin: ${pin_buz}   #27 
      id: rtttl_out

   # - - - - - - - - - - - - - - -  - -
  spi:                
    clk_pin:  ${pin_spi_clk}  #14
    mosi_pin: ${pin_spi_mosi} #13 # output data мастер выдает помошник принимает
    miso_pin: ${pin_spi_miso} #12 # input data мастер  принимает помошник выдает
   # - - - - - - - - - - - - - - -  - -  #--------------
  touchscreen:
    platform: xpt2046
    id: my_touch
    cs_pin: ${pin_tch_cs}   #33 33
    calibration:
      x_min: 200
      x_max: 3830
      y_min: 320 #170
      y_max: 3830 #3680
    transform:
      swap_xy: true #  для 2,8 красного true
      mirror_x: false # для 2,8 красного false
      mirror_y: true
    #on_touch:
    #    - lambda: |-
    #        ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
    #            touch.x,
    #            touch.y,
    #            touch.x_raw,
    #            touch.y_raw
    #          );   
    on_release:                         # отпустил палец от екрана
      then:
        - if:                           # если
            condition: lvgl.is_paused   # Проверяется, находится ли библиотека LVGL (графическая система) в режиме паузы.
            then:
              - lvgl.resume:            # Если LVGL действительно была «на паузе», эта команда возобновляет её работу.
              - lvgl.widget.redraw:     # Эта команда перерисовывает все объекты LVGL      
   
   # - - - - - - - - - - - - - - -  - -  #--------------- 
  display:
    - platform: ili9xxx
      model: ST7796   #ILI9341 #TFT 2.4
      id: my_display1     
      color_palette: 8BIT
      invert_colors: false
      cs_pin: ${pin_dsp_cs} #15  
      dc_pin: ${pin_dsp_dc} #2   
      #data_rate: 1MHz  # Установка частоты SPI на 40 МГц 
      # reset_pin: -1
      #    rotation: 270°
      transform:      
        mirror_x: true
        mirror_y: true
        swap_xy: true
      dimensions: 480x320
      #  height: 230 # 284 230 320
      #  width: 480 #  388 480 345 
      # update_interval: 5s 
   # - - - - - - - - - - - - - - -  - -# --------------------
  rtttl:
    output: rtttl_out
    id: my_rtttl
    gain: 10%    
  uart:
    - id: uart_0
      baud_rate: 115200
      rx_buffer_size: 384
      tx_pin: ${pin_jkbms_tx}
      rx_pin: ${pin_jkbms_rx}
    # - - - - - - - - - - - - - - - - - - - 
  jk_modbus:
    - id: modbus0      
      uart_id: uart_0
      rx_timeout: 50ms
    # - - - - - - - - - - - - - - - - - - - 
  jk_bms:
    - id: bms0
      jk_modbus_id: modbus0
      update_interval: 30s
    # - - - - - - - - - - - - - - - - - - -   
  time:
    - platform: sntp
      id: my_time
      timezone: "Europe/Kyiv"
      servers:
        - 0.pool.ntp.org
        - 1.pool.ntp.org
        - 2.pool.ntp.org
      update_interval: 3600s  
      on_time:
        - hours: 2,3,4,5  # включается switch_antiburn
          minutes: 5
          seconds: 0      # Каждый день в 02:05, 03:05, 04:05 и 05:05
          then:
            - switch.turn_on: switch_antiburn # 05-й минуте каждого часа включается switch_antiburn
        - hours: 2,3,4,5  # включается switch_antiburn
          minutes: 35
          seconds: 0  #
          then:
            - switch.turn_off: switch_antiburn  #   включается switch_antiburn  
    # - - - - - - - - - - - - - - - - - - - - - - - 
