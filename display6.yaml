 # set: esphome, esp32, logger, api, ota, wifi img_snowy
  esphome:
    name: display6
    friendly_name: display6
    comment: "Кухн холод температура" 
    on_boot:
      priority: -100
      then:
        - output.turn_on: led_dsp
        - output.turn_on: led_red
        - output.turn_on: led_grn
        - output.turn_on: led_blu
        - rtttl.play: ${beep1}  
   #- - - - - - - - - - - - - - - - - - -      
  esp32:
    board: esp32dev
    framework:
      type: esp-idf
      advanced:
        minimum_chip_revision: "3.1"     
   #- - - - - - - - - - - - - - - - - - -   
  logger:
   #- - - - - - - - - - - - - - - - - - -   
  api:
    encryption:
      key: "E01HN/7VZrFHRG3rMDuGmIj2WdDNpwNo4KhDwV1Z83s="
   #- - - - - - - - - - - - - - - - - - -   
  ota:
    platform: esphome
    password: "ca3568e846d668143bce44f6174dd397"
   #- - - - - - - - - - - - - - - - - - -   
  wifi:
    id: wifi_component
    ssid: !secret wifi_ssid
    password: !secret wifi_password
    on_connect:
      - script.execute: update_net_status
    on_disconnect:
      - script.execute: update_net_status
