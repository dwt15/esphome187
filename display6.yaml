  #- - - - - - - - - - - - - - - - - - -

 #script,interval 
  script:
   #pg_updata:
    - id: updata_updata
      then:
        - if:
            condition:
              lambda: |-
                return !lv_obj_has_flag(id(pg_main).obj, LV_OBJ_FLAG_HIDDEN);
            then:
              - script.execute: pg_main_update          
       #        - script.execute: flash_tmrt_err
        - if:
            condition:
              lambda: |-
                return !lv_obj_has_flag(id(pg_svet).obj, LV_OBJ_FLAG_HIDDEN);
            then:
              - script.execute: pg_svet_update   
        - script.execute: top_info_update        
      #- - - - - - - - - - - - - - - - 
    - id: pg_main_update
      then:
        - lambda: |-
            //

              static char bufh[16];
              static char bufl[16];
              float p;
              const int k=6;
              const float err=-99;
              static float s_tt[k]= {err+1,err+1,err+1,err+1,err+1,err+1};
              static esphome::sensor::Sensor* sn_tt[]={                  // temperature 
                                                id(main_tmrt_but1_tr),
                                                id(main_tmrt_but2_tr),
                                                id(main_tmrt_but3_tr),
                                                id(main_kotl_but1_tr), 
                                                id(main_kotl_but2_tr), 
                                                id(main_kotl_but3_tr),
                                                };  
              static lv_obj_t* lv_th[] = {                                             //                   
                                          id(main_tmrt_but1_th),
                                          id(main_tmrt_but2_th),
                                          id(main_tmrt_but3_th),
                                          id(main_kotl_but1_th),
                                          id(main_kotl_but2_th),                                
                                          id(main_kotl_but3_th),                                 
                                          }; 
              static lv_obj_t* lv_tl[] = {                                             //                   
                                          id(main_tmrt_but1_tl),
                                          id(main_tmrt_but2_tl),
                                          id(main_tmrt_but3_tl),
                                          id(main_kotl_but1_tl),
                                          id(main_kotl_but2_tl),                                
                                          id(main_kotl_but3_tl),                                 
                                          };   
            //  
               for(int i=0; i<k; i++){                 
                  if( isnan(sn_tt[i]->state) ){p=err;}
                    else{p=sn_tt[i]->state;}
                  if(s_tt[i]!=p){
                     s_tt[i]=p;
                     if(p==err){strcpy(bufh, "--"); strcpy(bufl, "-");}         
                        else{                
                          int ph=int(p); 
                          int pl=abs(int(10*p-10*ph));                    
                          snprintf(bufh, sizeof(bufh), "%i", ph);
                          snprintf(bufl, sizeof(bufl), "%i", pl);    
                        }
                     lv_label_set_text(lv_th[i], bufh ); 
                     lv_label_set_text(lv_tl[i], bufl); 
                  } // закрыли обновление печать              
               } // закрыли цикл 
            //  
                static int but_ss[]={0,0,0}; //0-err, 1-ok, 2-on, 3-power
                static bool but_sw[]={false,false,false,};
                static bool but_av[]={false,false,false,};
                static lv_obj_t* lv_b[] = {
                                          id(main_kotl_but1),
                                          id(main_kotl_but2),
                                          id(main_kotl_but3), 
                                           };
                static lv_obj_t* lv_i[] = {
                                          id(main_kotl_but1_ic),
                                          id(main_kotl_but2_ic),
                                          id(main_kotl_but3_ic), 
                                           };                
                static esphome::homeassistant::HomeassistantBinarySensor* bt_sw[]={   
                                  id(main_kotl_but1_ss),
                                  id(main_kotl_but2_ss),
                                  id(main_kotl_but3_ss),
                                };  
                static esphome::homeassistant::HomeassistantBinarySensor*  bt_av[]={
                                  id(main_kotl_but1_sa),
                                  id(main_kotl_but2_sa),
                                  id(main_kotl_but3_sa),
                                };
                static esphome::homeassistant::HomeassistantSensor*  bt_sp[]={
                                  id(main_kotl_but1_sp),
                                  id(main_kotl_but2_sp),
                                  id(main_kotl_but3_sp),
                                };              
              
              lv_color_t colr_bg;
              lv_color_t colr_ic;
              lv_color_t colr_bd;
              for(int i=0; i<3; i++){
                 int ss=1;                               // off
                 if(!bt_av[i]->state){ss=0;}             // 0-err
                  else{       
                     if(bt_sw[i]->state){
                           ss=2;                         //2-ON
                          if(bt_sp[i]->state>5){ss=3;}   //3-power
                     }
                 } 
                 if(but_ss[i]!=ss){
                    but_ss[i] =ss;
                    if(ss==0){     colr_bg= lv_color_hex(${main_kotl_but_colr_bg});
                                   colr_ic= lv_color_hex(${main_kotl_but_colr_ic_er}); 
                                   colr_bd= lv_color_hex(${main_kotl_but_colr_bd_er});
                    } 
                    else if(ss==1){colr_bg= lv_color_hex(${main_kotl_but_colr_bg});
                                   colr_ic= lv_color_hex(${main_kotl_but_colr_ic});
                                   colr_bd= lv_color_hex(${main_kotl_but_colr_bd});
                    }
                    else if(ss==2){colr_bg= lv_color_hex(${main_kotl_but_colr_bg_on});
                                   colr_ic= lv_color_hex(${main_kotl_but_colr_ic});
                                   colr_bd= lv_color_hex(${main_kotl_but_colr_bd_on});
                    }
                    else{          colr_bg= lv_color_hex(${main_kotl_but_colr_bg_pw});
                                   colr_ic= lv_color_hex(${main_kotl_but_colr_ic});
                                   colr_bd= lv_color_hex(${main_kotl_but_colr_bd_on});
                    }
                    lv_obj_set_style_text_color(  lv_i[i], colr_ic, LV_PART_MAIN); // 
                    lv_obj_set_style_bg_color(    lv_b[i], colr_bg, LV_PART_MAIN); // 
                    lv_obj_set_style_border_color(lv_b[i], colr_bd, LV_PART_MAIN); //
                 }// new
              } // for
      #- - - - - - - - - - -  - - - - -  - - - - -  -
    - id: pg_svet_update
      then:  
        - lambda: |-
             //
                static int bt_ss[]={0,0,0,0,0,0,0,0}; // 0-err,1-off,2-on
                int ss;
                lv_color_t colr_bg;                
                lv_color_t colr_bd;                 
                lv_color_t colr_ic;

                static lv_obj_t* lv_bt[] = {
                                          id(svet_but1),
                                          id(svet_but2),
                                          id(svet_but3),
                                          id(svet_but4),
                                          id(svet_but5), 
                                          id(svet_but6),  
                                          id(svet_but7), 
                                          id(svet_but8),                                            
                                           };                
                static lv_obj_t* lv_ic[] = {
                                          id(svet_but1_ic),
                                          id(svet_but2_ic),
                                          id(svet_but3_ic),
                                          id(svet_but4_ic),
                                          id(svet_but5_ic), 
                                          id(svet_but6_ic),  
                                          id(svet_but7_ic), 
                                          id(svet_but8_ic),
                                           };                          
                static esphome::homeassistant::HomeassistantBinarySensor* bt_sw[]={   
                                  id(svet_but1_st),
                                  id(svet_but2_st),
                                  id(svet_but3_st),
                                  id(svet_but4_st),
                                  id(svet_but5_st),
                                  id(svet_but6_st),
                                  id(svet_but7_st),
                                  id(svet_but8_st),
                                };      
             // 
                for(int i=0; i<8; i++){
                    if(isnan(bt_sw[i]->state)){ss=0;} 
                      else{ss=bt_sw[i]->state;
                           if(ss){ss=2;}  // ON  
                             else{ss=1;}  // OFF
                    } 
                    if(bt_ss[i]!=ss){
                        bt_ss[i]=ss; 
                        if(ss==0){     colr_bg=lv_color_hex(${svet_but_colr_bg});
                                       colr_bd=lv_color_hex(${svet_but_colr_bd}); 
                                       colr_ic=lv_color_hex(${svet_but_colr_ic_er});}  
                        else if(ss==1){colr_bg=lv_color_hex(${svet_but_colr_bg});
                                       colr_bd=lv_color_hex(${svet_but_colr_bd}); 
                                       colr_ic=lv_color_hex(${svet_but_colr_ic});}                            
                        else if(ss==2){colr_bg=lv_color_hex(${svet_but_colr_bg_on});                
                                       colr_bd=lv_color_hex(${svet_but_colr_bd_on}); 
                                       colr_ic=lv_color_hex(${svet_but_colr_ic_on});}                        
                        lv_obj_set_style_text_color(  lv_ic[i], colr_ic, LV_PART_MAIN); // 
                        lv_obj_set_style_bg_color(    lv_bt[i], colr_bg, LV_PART_MAIN); // 
                        lv_obj_set_style_border_color(lv_bt[i], colr_bd, LV_PART_MAIN); //                      
                    }
                } 
       
      #- - - - - - - - - - - - - - - - - - -
    - id: pg_maxt_updata
      parameters:
        s: int
      then:
        - lambda: |-
             //
              id(pg_select)=2;
              char bufh[16];
              char bufl[16];
              const char* nm[]={
                              "${main_tmrt_but1_n}",
                              "${main_tmrt_but2_n}",
                              "${main_tmrt_but3_n}",
                                };
              id(change_tmax)=s;
              float p=id(t_max)[s];
              int   ph=int(p); 
              int   pl=abs(int(10*p-10*ph));                    
              snprintf(bufh, sizeof(bufh), "%i", ph);
              snprintf(bufl, sizeof(bufl), "%i", pl); 
              lv_label_set_text(id(maxt_but_th), bufh ); 
              lv_label_set_text(id(maxt_but_tl), bufl);
              lv_label_set_text(id(maxt_but_nm), nm[s]) ;       
    - id: pg_maxt_change
      parameters:
        i: float
      then:
        - lambda: |    
            // 
             id(t_max)[id(change_tmax)]+=i; 
        - script.execute: 
            id:  pg_maxt_updata    
            s: !lambda 'return id(change_tmax);' 
    - id: top_select_change
      then:
        - lambda: |-
            if (     id(pg_select) == 0) {id(pg_select) =1; lv_scr_load((pg_svet)->obj);}     
            else if (id(pg_select) == 1) {id(pg_select) =0; lv_scr_load((pg_main)->obj);} 
            else if (id(pg_select) == 2) {id(pg_select) =0; lv_scr_load((pg_main)->obj);}
    - id: top_info_update
      then:
        - lambda: |-
             //    
              static int ic=-1; // 0-no 1- svet,2-kotel
              bool lh = id(svet_but1_st).state ||
                           id(svet_but2_st).state ||
                           id(svet_but3_st).state ||
                           id(svet_but4_st).state ||
                           id(svet_but5_st).state ||
                           id(svet_but6_st).state ||
                           id(svet_but7_st).state ;
              
              bool kt = id(main_kotl_but1_ss).state ||
                        id(main_kotl_but2_ss).state ||
                        id(main_kotl_but3_ss).state;
              int is;
              if((id(pg_select)==0) && lh){ // pg_main                
                 is=1;    
              }     
              else if((id(pg_select)==1) && kt){ // pg_svet
                 is=2;     
              } 
              else{is=0;}
              if(ic!=is){
                 ic=is;
                 const char* text;
                 if(     ic==0){text= "";}
                 else if(ic==1){text= "${lightbulb_on}";} 
                 else if(ic==2){text= "${fire}";}                 
                lv_label_set_text(id(top_info),text);
              }

