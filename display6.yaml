   #flash:
    - id: chek_kotel_tr # f_flash[1],f_flash[2],
      then:
        - lambda: |-
            //
               bool is_low = (id(main_kotl_but3_tr).state < 70.0f)&& id(main_kotl_but3_ss).state;
               id(f_flash)[1] = is_low;
               id(f_flash)[2] = is_low; 
      
      #- - - - - - - -  - - - - - - - - - - - - - -          
    - id: flash_err
      then:
        - lambda: |-
            //        
                static bool phase = false;
                phase = !phase;       
                static lv_obj_t* lv_lb[] = {              //                   
                                            id(lan_status),           // 0 lan connect
                                            id(main_kotl_but3_th),    // kotel gas tr
                                            id(main_kotl_but3_tl),    // kotel gas tr                          
                                            id(main_tmrt_but3_tl),    //
                                            };                
                
                for(int i=0; i<4; i++){
                  if (id(f_flash)[i] ) {
                      if (phase){lv_obj_add_flag(lv_lb[i], LV_OBJ_FLAG_HIDDEN);}                 
                       else {  lv_obj_clear_flag(lv_lb[i], LV_OBJ_FLAG_HIDDEN); }   
                  } else {     lv_obj_clear_flag(lv_lb[i], LV_OBJ_FLAG_HIDDEN);} 
                                      
                }      
      
      #- - - - - - - -  - - - - - - - - - - - - - -     
    - id: flash_tmrt_err
      then:
        - lambda: |-
            //              
                static bool phase = false;
                phase = !phase;                
                static esphome::sensor::Sensor* t_sen[]={ // temperature 
                                                  id(main_tmrt_but1_tr),
                                                  id(main_tmrt_but2_tr),
                                                  id(main_tmrt_but3_tr),
                                                  };                
                static lv_obj_t* lv_th[] = {              //                   
                                            id(main_tmrt_but1_th),
                                            id(main_tmrt_but2_th),
                                            id(main_tmrt_but3_th),                                
                                            }; 
                static lv_obj_t* lv_tl[] = {              //                   
                                            id(main_tmrt_but1_tl),
                                            id(main_tmrt_but2_tl),
                                            id(main_tmrt_but3_tl),                               
                                            };             
            //  
                for(int i=0; i<3; i++){
                  if (t_sen[i]->state > id(t_max)[i]) {
                      if (phase){
                          lv_obj_add_flag(lv_th[i], LV_OBJ_FLAG_HIDDEN);
                          lv_obj_add_flag(lv_tl[i], LV_OBJ_FLAG_HIDDEN);              
                      } else {
                          lv_obj_clear_flag(lv_th[i], LV_OBJ_FLAG_HIDDEN);
                          lv_obj_clear_flag(lv_tl[i], LV_OBJ_FLAG_HIDDEN); 
                      }
                  } else {
                      lv_obj_clear_flag(lv_th[i], LV_OBJ_FLAG_HIDDEN);
                      lv_obj_clear_flag(lv_tl[i], LV_OBJ_FLAG_HIDDEN); 
                  }               
                }

       
      
