      then:
          - lambda: |-
                const int t=60;
                static int  time=t;            
                if (time==0) {id(updata_updata).execute();return;}                       
                if (time>0)  {time=time-1;}
                if (time==1) {lv_scr_load(id(pg_main).obj);return;}            
                if (time==(t-1)){lv_scr_load(id(pg_sysi).obj);return;}
