   #updata_battery
    - id: updata_pg2_batt
      then:
        - lambda: |-
            // 
              static char buf[16];
              static int n = 7*3;
              static float p;
              static float err = -9865;
              static float bt[]= {err,err,err,err,err,err,err,
                                  err,err,err,err,err,err,err,
                                  err,err,err,err,err,err,err,};
              
              static lv_obj_t* lv_bt[] = {                                             //                   
                                      id(pg2_batt_1p2),  // 1
                                      id(pg2_batt_1p3),  // 2       
                                      id(pg2_batt_1p4),  // 3
                                      id(pg2_batt_1p5),  // 4
                                      id(pg2_batt_1p6),  // 5
                                      id(pg2_batt_1p7),  // 6
                                      id(pg2_batt_1p8),  // 7                                       
                                      
                                      id(pg2_batt_2p2),  // 1
                                      id(pg2_batt_2p3),  // 2        
                                      id(pg2_batt_2p4),  // 3
                                      id(pg2_batt_2p5),  // 4
                                      id(pg2_batt_2p6),  // 5
                                      id(pg2_batt_2p7),  // 6
                                      id(pg2_batt_2p8),  // 7                                     
                                      
                                      id(pg2_batt_3p2),  // 1
                                      id(pg2_batt_3p3),  // 2        
                                      id(pg2_batt_3p4),  // 3
                                      id(pg2_batt_3p5),  // 4
                                      id(pg2_batt_3p6),  // 5
                                      id(pg2_batt_3p7),  // 6
                                      id(pg2_batt_3p8),  // 7                                         
                                      };    
              static esphome::homeassistant::HomeassistantSensor*   sn_bt[]={                                                                             
                                      
                                      
                                      id(pg2_batt_1sn2),  // 1
                                      id(pg2_batt_1sn3),  // 2       
                                      id(pg2_batt_1sn4),  // 3                                      
                                      id(pg2_batt_1sn5),  // 4                                       
                                      id(pg2_batt_1sn6),  // 5  
                                      id(pg2_batt_1sn7),  // 6 
                                      id(pg2_batt_1sn8),  // 7 
                                      
                                      id(pg2_batt_2sn2),  // 1
                                      id(pg2_batt_2sn3),  // 2        
                                      id(pg2_batt_2sn4),  // 3
                                      id(pg2_batt_2sn5),  // 4
                                      id(pg2_batt_2sn6),  // 5
                                      id(pg2_batt_2sn7),  // 6
                                      id(pg2_batt_2sn8),  // 7 
                                         
                                      id(pg2_batt_3sn2),  // 1
                                      id(pg2_batt_3sn3),  // 2        
                                      id(pg2_batt_3sn4),  // 3
                                      id(pg2_batt_3sn5),  // 4
                                      id(pg2_batt_3sn6),  // 5
                                      id(pg2_batt_3sn7),  // 6
                                      id(pg2_batt_3sn8),  // 7                                          
                                         
                                         };

            //
              for(int i=0; i<n; i++){
                   if(isnan(sn_bt[i]->state)){p=err;} 
                     else {p=sn_bt[i]->state;}       
                   if(bt[i] != p ){
                      bt[i]  = p;
                      if(p==err){strcpy(buf, "-");} 
                        else{                 
                              if( i==0  || i==1  ||
                                  i==7  || i== 8 ||
                                  i==14 || i==15  ){snprintf(buf,  sizeof(buf), "%0.1f", p);}
                          else if(i==2  || i==3  ||
                                  i==9  || i==10 || 
                                  i==16 || i==17  ){snprintf(buf,  sizeof(buf), "%2.2f", p);}                          
                          
                          else if(i==4  || i==5  || i==6  ||
                                  i==11 || i==12 || i==13 ||
                                  i==18 || i==19 || i==20  ){snprintf(buf,  sizeof(buf), "%1.3f", p);}
                        }
                      lv_label_set_text(lv_bt[i], buf ); 
                   } // закрыли обновление печать              
                } // закрыли цикл
            

