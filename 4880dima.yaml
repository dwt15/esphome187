  time:
    - platform: sntp
      id: my_time
      timezone: "Europe/Kyiv"
      servers:
        - 0.pool.ntp.org
        - 1.pool.ntp.org
        - 2.pool.ntp.org
      update_interval: 3600s
      on_time:
        - seconds: /1  # каждую секунду
          then:
            - lambda: |-
                //
                  //return;
                  auto now = id(my_time).now();
                  if (!now.is_valid()) return;
                  static int last_sec = -1;
                  static int last_min = -1;
                  static int last_hour = -1;
                  static int last_day = -1;
                  static int last_month = -1;
                  static int last_wday = -1;    
                  int sec = now.second;
                  int min = now.minute;
                  int hour = now.hour;
                  int day = now.day_of_month;
                  int month = now.month;
                  int wday = now.day_of_week;  // 0 = воскресенье, 1 = понедельник ...
                  char buf[20];
                // СЕКУНДЫ   {time_t3}
                  if (sec != last_sec) {
                    last_sec = sec;
                    snprintf(buf, sizeof(buf), "%02d", sec);
                    lv_label_set_text(id(pg2_time_sc), buf);
                  }
                // МИНУТЫ + ЧАСЫ
                  
                  if (min != last_min) {
                    last_min = min;
                    snprintf(buf, sizeof(buf), "%2d:%02d", hour,  min);
                    lv_label_set_text(id(pg2_time_hhmm), buf);
                  }
                 
                // ЧАСЫ
                  //if (hour != last_hour) {
                  //  last_hour = hour;
                  //  snprintf(buf, sizeof(buf), "%02d", hour);
                  //  lv_label_set_text(id(time_t3), buf);
                  //}
                // день недели
                  if (wday != last_wday) {
                    last_wday = wday;
                    //const char* wday_names[] = {"ВС","ПН","ВТ","СР","ЧТ","ПТ","СБ"}; // массив наименований день недели{
                    const char* wday_names[] = {"вс","пн","вт","ср","чт","пт","сб"}; // массив 
                    lv_label_set_text(id(pg2_data_ww), wday_names[wday-1]);                      
                    lv_color_t colort = lv_color_make(0,200,0);  // цвет нормальный
                    if (wday == 1 or wday == 7 ) {colort = lv_color_make(255,150,0);}  // воскресенье суббота
                    lv_obj_set_style_text_color(id(pg2_data_ww), colort, LV_PART_MAIN); // цвет дня недели
                    colort = lv_color_make(0,200,0);  // цвет нормальный
                    if (wday == 1) {colort = lv_color_make(255,150,0);}  // воскресенье
                    lv_obj_set_style_text_color(id(pg2_data_dd), colort, LV_PART_MAIN); // цвет даты  
                  }
                // день месяца
                  if (day != last_day) {
                    last_day = day;
                    snprintf(buf, sizeof(buf), "%2d", day);
                    lv_label_set_text(id(pg2_data_dd), buf);
                  }
                // месяц
                  if (month != last_month) {
                    last_month = month;
                    snprintf(buf, sizeof(buf), "%02d",  month); 
                    lv_label_set_text(id(pg2_data_mm),  buf  );
                  }   
                  
        - hours: 2,3,4,5 
          minutes: 5
          seconds: 0      # Каждый день в 02:05, 03:05, 04:05 и 05:05
          then:
            - switch.turn_on: switch_antiburn # 05-й минуте каждого часа включается switch_antiburn
        - hours: 2,3,4,5
          minutes: 35
          seconds: 0  #
          then:
            - switch.turn_off: switch_antiburn  #
