   #updata_pg
    - id: pg2_select_obj
      parameters:
        s: int
      then:
        - lambda: |-
            //
              id(my_rtttl).play("${beep2}");
              static int n=4;  //0-pv, 1-gr, 2-bt ,3-dm             
              static lv_obj_t* n_obj[] = {                                                                
                                        id(pg2_pv),   // 0
                                        id(pg2_grid), // 1
                                        id(pg2_batt), // 2
                                        id(pg2_plan), // 3
                                        
                                         };
            //  
                if (s < 0 || s >= n) return;  // защита от выхода за пределы
                
                for(int i=0; i<n;i++){                  
                  lv_obj_add_flag(n_obj[i], LV_OBJ_FLAG_HIDDEN);  // скрыть              
                }
                lv_obj_clear_flag(n_obj[s], LV_OBJ_FLAG_HIDDEN);  // показать выбранный  
      
      # - - - - - - - - - - - - - - - - - -       
    - id: updata_pg2_main1
      then:
        - lambda: |-   
             //  
                static float p;
                static int pi,pd;
                static char buf[16];
                static char buf2[16];
                static float err= -98765;
                static float off= -987654;
                
                static float kwhx[]={err,err,err,err }; 
                static lv_obj_t* lv_kwhh[] = {                                             //                   
                                id(pg2_main_kwhh_pv),
                                id(pg2_main_kwhh_gr),
                                id(pg2_main_kwhh_bt),
                                id(pg2_main_kwhh_dm),
                                };       
                static lv_obj_t* lv_kwhl[] = {                                             //                   
                                id(pg2_main_kwhl_pv),
                                id(pg2_main_kwhl_gr),
                                id(pg2_main_kwhl_bt),
                                id(pg2_main_kwhl_dm),
                                };                
                static esphome::homeassistant::HomeassistantSensor*   sn_kwhx[]={
                                        id(pg2_main_kwhx_pv_sn),
                                        id(pg2_main_kwhx_gr_sn),
                                        id(pg2_main_kwhx_bt_sn),
                                        id(pg2_main_kwhx_dm_sn),
                                        };  
              //- - - w a t t - - - -                           
               //- pv - - - 
                static float pv_watt= err;  
                if(isnan(id(pg2_main_watt_pv_sn).state)){p=err; } 
                  else{p=id(pg2_main_watt_pv_sn).state;}
                if(fabsf(pv_watt -p) > 1){
                   pv_watt = p;
                   if(p==err){strcpy(buf, "---");} 
                   else{snprintf(buf, sizeof(buf), "%0.0f", p);}
                   lv_label_set_text(id(pg2_main_watt_pv), buf );                 
                }               
               //- gr - - -              
                static float gr_watt= off; 
                if(!(id(pg2_main_gr_av).state)){p=err; } 
                  else if(!id(pg2_main_gr_sw).state){p=off;}
                  else{p=id(pg2_main_watt_gr_sn).state;}
                if( fabsf(gr_watt-p)>1){
                   gr_watt = p;
                   if(     p==err){strcpy(buf, "-x-");}
                   else if(p==off){strcpy(buf, "---");}        
                   else{snprintf(buf, sizeof(buf), "%0.0f", p);}
                   lv_label_set_text(id(pg2_main_watt_gr), buf );                                 
                }                                                  
               //- bt  - - -               
                static float bt_watt= err; 
                if(isnan(id(pg2_main_watt_bt_sn).state)){p=err; } 
                  else{p=id(pg2_main_watt_bt_sn).state;}
                if(fabsf(bt_watt-p)>1){
                   bt_watt = p;
                   if(p==err){strcpy(buf, "---");} 
                   else{snprintf(buf, sizeof(buf), "%0.0f", p);}
                   lv_label_set_text(id(pg2_main_watt_bt), buf );                 
                   static bool st= true;
                   if((p>0) && !st ){ 
                      st = true;
                      lv_obj_set_style_text_color(id(pg2_main_watt_bt), lv_color_hex(${pg2_main_colr_watt}), LV_PART_MAIN);
                      } 
                    else if((p<0) && st ){
                      st = false;
                      lv_obj_set_style_text_color(id(pg2_main_watt_bt), lv_color_hex(${pg2_main_colr_wtgr}), LV_PART_MAIN);
                   }              
                }                 
               //- dm  - - - -                
                static float dm_watt= off; 
                if(!(id(pg2_main_dm_av).state)  ){p=err; } 
                  else if(!id(pg2_main_dm_sw).state){p=off;}
                  else{p=id(pg2_main_watt_dm_sn).state;}
                if(dm_watt !=p){
                   dm_watt = p;
                   if(     p==err){strcpy(buf, "-x-");} 
                   else if(p==off){strcpy(buf, "---");} 
                   else{snprintf(buf, sizeof(buf), "%0.0f", p);}
                   lv_label_set_text(id(pg2_main_watt_dm), buf );                 
                }                            
              //- - - k w h x - - - -                
                for(int i=0; i<4;i++){
                   if(isnan(sn_kwhx[i]->state)){p=err;} 
                     else {p=sn_kwhx[i]->state;}       
                   if(fabsf(kwhx[i]-p) > 0.04999 ){
                      kwhx[i] = p;
                      if(p==err){strcpy(buf, "--_"); strcpy(buf2, "-");} 
                        else{
                         p=p+0.05;
                         pi=int(p); pd=int(10*(p-pi));                    
                         snprintf(buf,  sizeof(buf), "%i.", pi);
                         snprintf(buf2, sizeof(buf), "%i",  pd);
                        }
                      lv_label_set_text(lv_kwhh[i], buf ); 
                      lv_label_set_text(lv_kwhl[i], buf2); 
                   } // закрыли обновление печать              
                } // закрыли цикл
