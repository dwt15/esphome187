 #set: output, #rtttl, i2c, uart,  touch, display, remote_receiver, time
  output:   # 2 яркость экрана
    - platform: ledc
      pin: ${pin_out_ledc} # 2   # яркость
      id: led_tft
      channel: 0
     
      frequency: 2000 Hz
    - platform: ledc  # бузер     
      pin: ${pin_rtttl}
      channel: 2
      frequency: 100 Hz
      id: rtttl_out  
    # - - - - - - - - - - - - - - - - - - - - - - - - - -  - -
  rtttl:
    output: rtttl_out
    id: my_rtttl
    gain: 10%
   # - - - - - - - - - - 
  i2c:      # тач 19,20
    sda: ${pin_i2c_sda} # 19 #19    тач
    scl: ${pin_i2c_scl} # 20
    scan: true
    id: bus_a
    # - - - - - - - - - - - - - - - - - - - - - - - - - -  - -
  #uart:     # ld2420
   # tx_pin: ${pin_uart_tx} # GPIO11 # желтый
   # rx_pin: ${pin_uart_rx} # GPIO12 # 
   # baud_rate: 115200  
    # - - - - - - - - - - - - - - - - - - - - - - - - - -  - -
  touchscreen:
    platform: gt911
    id: my_touch
    i2c_id: bus_a
    address: 0x5D
    calibration:
      x_min: 11  # L:200    R:200 
      x_max: 800  # L:3830  R:3830 
      y_min: 13  # L:170    R:170
      y_max: 480 # L:3780   R:3780
    #  transform:
      #    swap_xy: true #  L:true  R:true
      #    mirror_x: true # L:true  R:false
      #    mirror_y: true # L:true  R:false
    on_touch:
        - lambda: |-
              ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
                  touch.x,
                  touch.y,
                  touch.x_raw,
                  touch.y_raw
                  );  
    on_release:                         # отпустил палец от екрана
      then:
        - if:                           # если
            condition: lvgl.is_paused   # Проверяется, находится ли библиотека LVGL (графическая система) в режиме паузы.
            then:
              - lvgl.resume:            # Если LVGL действительно была «на паузе», эта команда возобновляет её работу.
              - lvgl.widget.redraw:     # Эта команда перерисовывает все объекты LVGL 
              - switch.turn_off: switch_antiburn
    # - - - - - - - - - - - - - - - - - - - - - - - - - -  - -
  display:
    - platform: rpi_dpi_rgb
      id: my_display
      color_order: RGB
      invert_colors: True
      update_interval: never
      auto_clear_enabled: false # takes 2.8 seconds to clear the display
      dimensions:
        width: 800
        height: 480
      de_pin:    ${pin_ds_de} # 41 
      hsync_pin: ${pin_ds_hs} # 39
      vsync_pin: ${pin_ds_vs} # 40 
      pclk_pin:  ${pin_ds_ck} # 42
      hsync_back_porch:  16     #39    16   16 fixed      x 
      hsync_front_porch: 210     #50    210 180-210-240
      hsync_pulse_width: 46     #4     30             y x+y =46
      vsync_back_porch:  10      #9     10  10 fixed   a a+b=23
      vsync_front_porch: 22      #8     22  12-22-32   
      vsync_pulse_width: 13      #4      4  13         b 
      pclk_frequency:    9MHz   #9MHz   16 
      pclk_inverted: true
      data_pins:
        red:
          - ${pin_ds_r3}   # 14        # 0 r3
          - ${pin_ds_r4}   # 21        # 1 r4
          - ${pin_ds_r5}   # 47        # 2 r5
          - ${pin_ds_r6}   # 48        # 3 r6
          - ${pin_ds_r7}   # 45        # 4 r7
        green:
          - ${pin_ds_g2}   # 9         # 0 g2
          - ${pin_ds_g3}   # 46        # 1 g3
          - ${pin_ds_g4}   # 3         # 2 g4
          - ${pin_ds_g5}   # 8         # 3 g5
          - ${pin_ds_g6}   # 16        # 4 g6
          - ${pin_ds_g7}   # 1         # 5 g7
        blue:
          - ${pin_ds_b3}   # 15        # 0 b3
