  switch:
    - platform: template
      name: Antiburn
      id: switch_antiburn
      icon: mdi:television-shimmer
      optimistic: true
      entity_category: "config"
      turn_on_action:
        - logger.log: "Starting Antiburn"
        - if:
            condition: lvgl.is_paused
            then:
              - lvgl.resume:
              - lvgl.widget.redraw:
        - lvgl.pause:
            show_snow: true
        #- lambda: |-
        #      id(led_tft).set_level(0.25);       
      turn_off_action:
        - logger.log: "Stopping Antiburn"
        - if:
            condition: lvgl.is_paused
            then:
              - lvgl.resume:
              - lvgl.widget.redraw:
        #- lambda: |-
        #      id(led_tft).set_level(id(display_yrkost)/100.0); 
