                                        };              
                
            // 
               int ava; 
               for(int i=0;i<12;i++){

                  if(isnan(sb_av[i]->state) || !sb_av[i]->has_state() ){ss=3;}
                   else{
                      if(!(sb_av[i]->state)){ss=2;}
