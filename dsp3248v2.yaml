esphome:
  name: dsp3248v2
  friendly_name: dsp3248v2
  platformio_options:
    board_build.psram: disabled
  on_boot:
    priority: 600
    then:     
      - output.turn_on: led_sv
      - output.turn_on: gpio_17
      - output.turn_on: gpio_16
      - output.turn_on: gpio_4
#      - lambda: |- 
#         id(led_sv).set_level(0.1);
#         id(gpio_17).set_level(0.1);
#         id(gpio_16).set_level(0.1);
#         id(gpio_4).set_level(0.1);

esp32:
  board: esp32dev #esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "rE8ZRyLagzdyFAILpICnJP+iPxMrFksdkaUyaPAVBS0="

ota:
  - platform: esphome
    password: "4e2f9c41f3e39bd8fc64b02c3d00d9a7"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Dsp3248V2 Fallback Hotspot"
    password: "EilSFft7PoOm"

captive_portal:

output:
  - platform: ledc
    pin: 27
    id: led_sv 
  - platform: ledc
    pin: 17
    id: gpio_17 # blue
  - platform: ledc
    pin: 16
    id: gpio_16 # green       
  - platform: ledc
    pin: 4 
    id: gpio_4 # red
 
#interval:

#------------------
spi:
  clk_pin: 14
  mosi_pin: 13 # output data мастер выдает помошник принимает
  miso_pin: 12 # input data мастер  принимает помошник выдает      
  
#--------------------------------------
sensor:
  - platform: adc
    id: svet_0
    name: svet
    pin: 34
    update_interval: 1s
    on_value:
      then:
        - lambda: |-                
            if( id(svet_0).state <0.15 ){ id(led_sv).set_level(1.0);}
              else{ id(led_sv).set_level(0.1);}

touchscreen:
  platform: xpt2046
  id: my_touch
  cs_pin: 33
  calibration:
    x_min: 200
    x_max: 3830
    y_min: 170
    y_max: 3680
  transform:
    swap_xy: true #  для 2,8 красного true
    mirror_x: false # для 2,8 красного false
    mirror_y: true
  on_touch:
       - lambda: |-
           ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
              touch.x,
               touch.y,
              touch.x_raw,
              touch.y_raw
             );  

display:
  - platform: ili9xxx
    model: ST7796   #ILI9341 #TFT 2.4
    id: my_display1     
    color_palette: 8BIT
    invert_colors: false
    cs_pin: 15  
    dc_pin: 2   
    #data_rate: 1MHz  # Установка частоты SPI на 40 МГц 
   # reset_pin: -1
    #    rotation: 270°
    transform:      
      mirror_x: true
      mirror_y: true
      swap_xy: true
    dimensions: 480x320
    #  height: 230 # 284 230 320
    #  width: 480 #  388 480 345 
    update_interval: 5s 
     
lvgl:
  touchscreens:
    - my_touch
  displays:
    - my_display1
