binary_sensor:

# platform: touchscreen

 # page_0 стартовая страница все мелко
  - platform: touchscreen  # page_0 -> page_1 показатели крупно 
    name: Sel
    x_min: 0
    x_max: 220
    y_min: 0
    y_max: 110
    page_id: page_0
    filters:
        - delayed_on: 20ms    
    on_press:
      then:
        - lambda: |-             
           id(page_i)=1;
           id(my_display1).show_page(id(page_1));
           id(my_display1).update();          
  - platform: touchscreen  # page_0 -> page_2  
    name: Sel
    x_min: 0
    x_max: 220
    y_min: 138
