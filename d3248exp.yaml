 #set: esphome, esp32, logger, api, ota, wifi img_snowy
  esphome:
    name: d3248exp
    friendly_name: d3248exp
    comment: "d3248exp " 
    on_boot:
      priority: 600
      then:     
        
        - output.turn_on: led_tft
        - output.turn_on: led_red
        - output.turn_on: led_grn
        - output.turn_on: led_blu
        - lambda: |-
              id(led_tft).set_level(0.5); 
        - delay: 200ms
        #- lvgl.page.show: pg_main   

   # - - - - - - - - - - - - - - -  - -
  esp32:
    board: esp32dev
    flash_size: 4MB
    framework:
      type: esp-idf
      advanced:
        minimum_chip_revision: "3.1"   
   # - - - - - - - - - - - - - - -  - -
   # Enable logging
  logger:

   # Enable Home Assistant API
   # - - - - - - - - - - - - - - -  - -  
  api:
    reboot_timeout: 10min
    encryption:
      key: "2qqpx6ba0WU5WustCMpKBSx3spLOcfh9omJDu7/v3bI="
   # - - - - - - - - - - - - - - -  - -
  ota:
    - platform: esphome
      password: "14e37ac1cc351a2151242e9f8b70e7b6"
   # - - - - - - - - - - - - - - -  - -
  wifi:
    id: wifi_component
    ssid: !secret wifi_ssid
    password: !secret wifi_password
    on_connect:
      - script.execute: update_net_status
    on_disconnect:
      - script.execute: update_net_status           
   # - - - - - - - - - - - - - - -  - -

