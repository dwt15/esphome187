      pin: ${pin_light} #34
      update_interval: 2s
      on_value:
        then:
          - lambda: |-                
              static float sv;
              if(fabsf(sv-id(light_value).state)>0.02){
                 //id(switch_antiburn).turn_off();
                 sv=id(light_value).state;
                      if(sv<0.1           ){ id(led_tft).set_level(0.7);}
