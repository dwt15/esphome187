                id(f_flash)[0]=true;                                   // 
              } else {
                // 🟢 всё ок
                lv_obj_set_style_text_color(id(lan_status), lv_color_hex(0x00ffff), 0);
                lv_label_set_text(id(lan_status), "${lan_connect}");
                id(f_flash)[0]=false; // 
                id(f_timer)[0]=true;
              }    
    - id: flash_err
      then:
        - lambda: |-
            //        
                static bool phase = false;
                phase = !phase;       
                const int k = 5;
                static lv_obj_t* lv_lb[] = {              //                   
                                            id(${f_flash0_lv}),    // 0 lan connect                                        
                                            id(${f_flash1_lv}),    // 1 boiler1
                                            id(${f_flash2_lv}),    // 2 boiler2
                                            id(${f_flash3_lv}),    // 3 kran voda boiler
                                            id(${f_flash4_lv}),    // 4 kran voda general                                            
                                            };                
                
                for(int i=0; i<k; i++){
                  if (id(f_flash)[i] ) {                            // флаг актифный мигаем
                      if (phase){lv_obj_add_flag(lv_lb[i], LV_OBJ_FLAG_HIDDEN);}                 
                       else {  lv_obj_clear_flag(lv_lb[i], LV_OBJ_FLAG_HIDDEN); }   
                   }else{                                           //флаг выключен
                     if(id(s_flash)[i]){                            //устанавливаем видимость/невидимость по флагу   
                        if ( lv_obj_has_flag(lv_lb[i], LV_OBJ_FLAG_HIDDEN)) {lv_obj_clear_flag(lv_lb[i], LV_OBJ_FLAG_HIDDEN);}                                
                      }else{ 
                        if (!lv_obj_has_flag(lv_lb[i], LV_OBJ_FLAG_HIDDEN)) {  lv_obj_add_flag(lv_lb[i], LV_OBJ_FLAG_HIDDEN);}
                     }                                      
                  }
                }
      #- - - - - - - - - - - - - - - - -         
    - id: timer
      then:
        - lambda: |-
             //                         
              static char buf[20];
              // timer0  показывает статус соединения на весь екран 
                 const int t0=5;                                
               // віполнить при старте
                  if(id(f_timer)[0]){                            
                     id(f_timer)[0]=false;
                     id(timer0) = t0;                                               // 
                    lv_obj_clear_flag(id(lan_status_obj), LV_OBJ_FLAG_HIDDEN); // visible
                  }                 
               // выполнять в процессе 
                  if(id(timer0) > 0){                                
                     id(timer0)--;
                  }
               // віполнять в конце
                  if(id(timer0) == 0){             
                     id(timer0) = -1;                                                //
                     lv_obj_add_flag(id(lan_status_obj), LV_OBJ_FLAG_HIDDEN); // no visible
                  }
              
              // timer1  при старте показывает страницу sysinfo 
                 const int t1=10;                                                  
               // віполнить при старте
                  if(id(f_timer)[1]){                            
                     id(f_timer)[1]=false;
                     id(timer1) = t1;                                               //                      
                    lv_scr_load(id(pg_sysi).obj);
                  }                 
               // выполнять в процессе 
                  if(id(timer1) > 0){                                
                     id(timer1)--;
                  }
               // віполнять в конце
                  if(id(timer1) == 0){             
                     id(timer1) = -1;                                                //                   
                     lv_scr_load(id(pg_main).obj);
                  }                

              // timer2  при закр/отк крана Boiler 
                 const int t2=20;                                                  
               // віполнить при старте
                  if(id(f_timer)[2]){                            
                     id(f_timer)[2]=false;
                     id(timer2) = t2;                                               //                                         
                  }                 
                  if(id(timer2) >= 0){                                             
                       if(id(timer2) > 0){   // выполнять в процессе                                
                          snprintf(buf, sizeof(buf), "%d", id(timer2));                      
                          lv_label_set_text(id(crash_aqua_but0_p_base), buf);                     
                          id(timer2)--;
                        } else {             // віполнять в конце                                                                                
                          id(timer2) = -1;                                                //                                    
                      }                       
                  }               
              // timer3  при закр/отк крана Главный 
                 const int t3=20;                                                  
               // віполнить при старте
                  if(id(f_timer)[3]){                            
                     id(f_timer)[3]=false;
                     id(timer3) = t3;                                               //                                         
                  }                 
                  if(id(timer3) >= 0){                                             
                       if(id(timer3) > 0){   // выполнять в процессе                                
                          snprintf(buf, sizeof(buf), "%d", id(timer3));                      
                          lv_label_set_text(id(crash_aqua_but1_p_base), buf);                     
                          id(timer3)--;
                        } else {             // віполнять в конце                                                                                
                          id(timer3) = -1;                                                //                                    
                      }                       
                  }
