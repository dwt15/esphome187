   # - - - - - - - - - - - - - - - - - - - 
  uart:          
    tx_pin: ${pin_ld2420_tx} #21
    rx_pin: ${pin_ld2420_rx} #22
    baud_rate: 115200  
   # - - - - - - - - - -   
  rtttl:         
    output: rtttl_out
    id: my_rtttl
    gain: 10%  
   # - - - - - - - - - - - - - - - - - - -   
  #ld2420: 
  spi:                
    clk_pin:  ${pin_spi_clk}  #14
    mosi_pin: ${pin_spi_mosi} #13 # output data мастер выдает помошник принимает
    miso_pin: ${pin_spi_miso} #12 # input data мастер  принимает помошник выдает
   # - - - - - - - - - - - - - - 
  touchscreen:         
    platform: xpt2046
    id: my_touch
    cs_pin: ${pin_tch_cs}   #33
    calibration:
      x_min: 200
      x_max: 3830
      y_min: 320
      y_max: 3830
    transform:
      swap_xy: true #  для 2,8 красного true
      mirror_x: false # для 2,8 красного false
      mirror_y: true
    on_touch:
        - lambda: |-
            ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
                touch.x,
                touch.y,
                touch.x_raw,
                touch.y_raw
              );   
            //id(my_rtttl).play("${beep1}");
   # - - - - - - - - - - - - - - -  
  display:             
    - platform: mipi_spi #ili9xxx
      model:  ESP32-2432S028-9342 #ESP32-2432S028-7789 #ST7796   #ILI9341 #TFT 2.4
      id: my_display1     
      #color_palette: 8BIT # для mipi_spi не надо
      invert_colors: false
      cs_pin: ${pin_dsp_cs} #15  
      dc_pin: ${pin_dsp_dc} #2   
      # reset_pin: -1
      transform:      
        mirror_x: true
        mirror_y: true
        swap_xy: true
          #rotation: 270°
      dimensions: 480x320         
         #  height: 230  
         #  width: 480         
      #data_rate: 1MHz  # Установка частоты SPI на 40 МГц    
      # update_interval: 5s 
    # - - - - - - - - - - - - - - - -   
  time:
    - platform: sntp
      id: my_time
      timezone: "Europe/Kyiv"
      servers:
        - 0.pool.ntp.org
        - 1.pool.ntp.org
        - 2.pool.ntp.org
      update_interval: 3600s  
