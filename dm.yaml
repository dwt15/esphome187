    # - - - - - - - - - - - - - - - - - - - 
  uart:          
    tx_pin: ${pin_ld2420_tx} #21
    rx_pin: ${pin_ld2420_rx} #22
    baud_rate: 115200  
   # - - - - - - - - - -   
  rtttl:         
    output: rtttl_out
    id: my_rtttl
    gain: 10%  
    # - - - - - - - - - - - - - - - - - - -   
 
      # - - - - - - - - - - - - - - - - - - - 
  spi:                
    clk_pin:  ${pin_spi_clk}  #14
    mosi_pin: ${pin_spi_mosi} #13 # output data мастер выдает помошник принимает
    miso_pin: ${pin_spi_miso} #12 # input data мастер  принимает помошник выдает
   # - - - - - - - - - - - - - - 
  time:
    - platform: sntp
      id: my_time
      timezone: "Europe/Kyiv"
      servers:
        - 0.pool.ntp.org
        - 1.pool.ntp.org
        - 2.pool.ntp.org
      update_interval: 3600s
      on_time:
        - seconds: /1     # каждую секунду
          then:
            - lambda: |-
                //
                  auto now = id(my_time).now();
                  if (!now.is_valid()) return;
                  static int last_sec = -1;
                  static int last_min = -1;
                  static int last_hour = -1;
                  static int last_day = -1;
                  static int last_month = -1;
                  static int last_wday = -1;    
                  int sec = now.second;
                  int min = now.minute;
                  int hour = now.hour;
                  int day = now.day_of_month;
                  int month = now.month;
