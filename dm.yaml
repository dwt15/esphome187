                          lv_obj_set_style_text_color(id(ch2_h),  lv_color_make( 0, 248,  0), LV_PART_MAIN);  // цвет time<15 ok   
                }
              }            


              id(time_c3) += 1;
              id(time_3).publish_state(id(time_c3));  
              static bool t_c3 = false;
              t_er = (id(time_c3) > t_w);
              if(t_c3 != t_er){
                t_c3  = t_er;
                if(t_er){lv_obj_set_style_text_color(id(ch3_td), lv_color_make(64,  48, 48), LV_PART_MAIN);  // цвет time>15 er
                          lv_obj_set_style_text_color(id(ch3_ti), lv_color_make(64,  48, 48), LV_PART_MAIN);  // цвет time>15 er
                          lv_obj_set_style_text_color(id(ch3_h),  lv_color_make(64,  48, 48), LV_PART_MAIN);  // цвет time>15 er
                } else { lv_obj_set_style_text_color(id(ch3_td), lv_color_make( 0, 248,  0), LV_PART_MAIN);  // цвет time<15 ok
                          lv_obj_set_style_text_color(id(ch3_ti), lv_color_make( 0, 248,  0), LV_PART_MAIN);  // цвет time<15 ok
                          lv_obj_set_style_text_color(id(ch3_h),  lv_color_make( 0, 248,  0), LV_PART_MAIN);  // цвет time<15 ok   
                }
              }
