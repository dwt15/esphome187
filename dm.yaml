        - lambda: |-
            //
              static char buf[16];             
              static float p; 
            // температура             
              if(isnan(id(temperature_1).state)){return;}
              p = id(temperature_1).state;
              int fi=int(p);
              int fd=int(10*(p-fi)); // fi-цел fd-дес                         
              snprintf(buf, sizeof(buf), "%i.", fi);
