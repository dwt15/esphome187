 # объявляем пины на отдачу
  - platform: ledc  # подсветка экрана 
    pin: 21
    id: led_tft 
  - platform: ledc  # светодиод на плате синий 
    pin: 17
    id: led_b   
  - platform: ledc  # светодиод на плате зеленый 
    pin: 16
    id: led_g      
  - platform: ledc  # светодиод на плате красный 
    pin: 4 
    id: led_r 

sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 30s
    entity_category: "diagnostic"


 # light sensor 
  - platform: adc  #
    id: light_value
    name: svet
    pin: 34
    update_interval: 2s
    on_value:
      then:
        - lambda: |-                
            if( id(light_value).state <0.1 ){ id(led_tft).set_level(0.7);}
            else{ id(led_tft).set_level(0.1);}

