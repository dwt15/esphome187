            it.printf( x2+dx3, y2+dy3+5 , id(roboto_17),   colori,TextAlign::TOP_LEFT,  "°" );          // вывод подписи °C
            it.printf( x2+dx4, y2+dy4,  id(roboto_25),   colori,TextAlign::TOP_LEFT,  ".%i", t_d );    // вывод дробной части
             // Время
            auto time_t = id(sntp_time).now();
            x2=282;  
