            // расчет поз координат Х  
            x1=0;           //x1=dp1;          // поз иконка
            x2=180;         //x1+dx1+dx2;  // поз 1 показатель
            x3=x2+dx3;      // поз размерность 1 показателя
            x4=265;          //x3+dx4;      // поз 2 показателя
            x5=x4+dx5;      // поз размерность 3 показателя
            // координат Y
            dy1=60;         //55;         // высота строки
            dr=32;         // dr=dp3; //  смещение для размерности по высоте  
            di=25;         //15;         // di=dp1; // смещение иконки по высоте  
            dp=10;           //dp=dp2; // смещение  2 показателя  
           
           // < 1 > панели            
             y=0;          //y=dp1;
               //it.image( x1, y+di, id(solar_panel_1), color0); //mdi:solar-panel-2
            it.printf( x1, y+di, id(icon_28), color0, "\U000F0D9B"); //mdi:solar-panel 
            it.printf(x2, y, id(my_font1_b), color2,TextAlign::TOP_RIGHT,  "%4.0f", id(dc_power).state);  // генерация с панелей mdi:solar-panel-large mdi:solar-power-variant
              //it.print( x3, y+dr, id(my_font2), color3, "W");
            it.printf(x4, y+dp, id(my_font2_b), color4, TextAlign::TOP_RIGHT, "%4.1f", id(solarman_daily_production).state); // потребление с сети mdi:transmission-tower-export                   
              //it.print( x5, y+dr, id(my_font2), color3, "kWh");
      
           // < 2 > сеть
             y=y+dy1;
               //it.image( x1, y+di, id(grid_in_1),  color0); //mdi:transmission-tower-export
            it.printf( x1, y+di, id(icon_28),  color0, "\U000F192C"); // mdi:transmission-tower-export
              if( id(z2_ph0_voltage).state < 170 or isnan(id(z2_ph0_power).state) ) {it.print(x2, y, id(my_font1_b), color5, TextAlign::TOP_RIGHT, "- - -");} // отсутствие внешней сети
                else { 
                  if( !id(z2_ph0).state ) {it.print(x2, y, id(my_font1_b), color2, TextAlign::TOP_RIGHT, "- - -");} // выключенно внешняя сеть пользователем
                   else {it.printf(x2, y, id(my_font1_b), color5, TextAlign::TOP_RIGHT, "%4.0f", id(solarman_total_grid_power).state);} // потребление с сети текущее mdi:transmission-tower-export         
                     }
            it.printf(x4, y+dp, id(my_font2_b), color4, TextAlign::TOP_RIGHT, "%4.1f", id(solarman_daily_energy_bought).state); // потребление с сети сутки mdi:transmission-tower-export
              
           
           // < 3 >  батарея     
             y=y+dy1;
             colorb=color6;// 
               //it.image( x1, y+di,     id(battery_1),  color0); // mdi:battery-charging-30 
            it.printf( x1, y+di, id(icon_28), color0, "\U000F010C"); // mdi:car-battery 
            if(id(bat_power).state <0) {colorb=color7;}
            it.printf(x2, y, id(my_font1_b), colorb, TextAlign::TOP_RIGHT, "%4.0f", id(bat_power).state ); // id(solarman_battery_power).stateпотребление/накопление батарея                   
              //it.print( x3, y+dr, id(my_font2), color3, "W");
            it.printf(x4, y+dp, id(my_font2_b), color4, TextAlign::TOP_RIGHT, "%.1f", id(bat_energy).state * 50/1000); // мощность по JK BMS 
              //it.print( x5, y+dr, id(my_font2), color3, "kWh");
           // < 4 > потребление          
             y=y+dy1;
               //it.image( x1, y+di,     id(flash_1),    color0);//mdi:flash
            it.printf( x1, y+di, id(icon_28), color0, "\U000F0241"); //mdi:flash
            it.printf(x2, y, id(my_font1_b), color10, TextAlign::TOP_RIGHT, "%4.0f", id(z2_ph1_power).state); // НАШЕ ПОТРЕБЛЕНИЕ 
              //it.print( x3, y+dr, id(my_font2), color3, "w");
            it.printf(x4, y+dp, id(my_font2_b), color4, TextAlign::TOP_RIGHT, "%4.1f", id(solarman_daily_load_consumption).state); // потребление с сети mdi:transmission-tower-export         
              //it.print( x5, y+dr, id(my_font2), color3, "kWh");
           
           //  РОЗЕТКИ
           // setup                               
              dy2=30; // ширина между строками                    
               
              x=292;  
              y=0; // variant c
           // <1>                
              f=id(rz1_swich).state; // rz1 бойлер1 подогрев
              p=id(rz1_power).state; //
             colori=color1; 
             if (f) {colori=color8;} 
             if (p > 5){ colori=color9;} // пошла нагрузка                                                                    
                //it.image(x, y, id(numeric_1_box_outline),colori);                    
             it.printf(x, y, id(icon_27),colori, "\U000F03A6"); // mdi:numeric_1_box_outline 
           // <2>  
              f=id(rz2_swich).state; // rz2 бойлер2 основной
              p=id(rz2_power).state; //                          
             colori=color1; y=y+dy2;  
             if (f) {colori=color8;} 
             if (p > 5){ colori=color9;} // пошла нагрузка                                                                    
                //it.image(x, y, id(numeric_2_box_outline),colori);                                            
             it.printf(x, y, id(icon_27),colori, "\U000F03A9"); // mdi:numeric_2_box_outline
           // <3>    
              f=id(rz8_swich).state; // rz8  МОРОЗИЛКА
              p=id(rz8_power).state; //                          
             colori=color1; y=y+dy2; 
             if (f) {colori=color8;} 
             if (p > 5){  colori=color9;} // пошла нагрузка                                                                    
                //it.image(x, y, id(snowflake),colori);                          
             it.printf(x, y, id(icon_27), colori, "\U000F0717"); // mdi:snowflake
           // <4>
              f=10;p=100;
              f=id(sw5_swich).state; // sw5 ХОЛОДИЛЬНИК+МИКРОВОЛНОВКА+ЧАЙНИК 
              p=id(sw5_power).state; //                          
             colori=color1; y=y+dy2; 
             if (f) {colori=color8;} 
             if (p > 5){  colori=color9;} // пошла нагрузка                                                                    
                //it.image(x, y, id(snowflake),colori);                                     
             it.printf(x, y, id(icon_27), colori, "\U000F0717");// mdi:snowflake
           // <5>
              f=id(rz3_swich).state; // rz3 КУХНЯ
              p=id(rz3_power).state; //                          
             colori=color1; y=y+dy2; 
             if (f) {colori=color8;} 
             if (p > 5){  colori=color9;} // пошла нагрузка                                                                    
                //it.image(x, y, id(power_plug),colori);             
             it.printf(x, y, id(icon_27), colori, "\U000F06A5"); // mdi:power_plug
           // <6>  
              f=id(rz6_swich).state;  // rz6 ДУХОВКА 
              p=id(rz6_power).state; //                          
             colori=color1; y=y+dy2; 
