globals:
  - id: page_i #
    type: int
    restore_value: no
    initial_value: '1' 
  - id: page_z #
    type: int
    restore_value: no
    initial_value: '5' 





interval:
  - interval: 2s
    then:  
      - lambda: |- 
         if(id(page_z)!=id(page_i)){
            id(page_z)=id(page_i);
            if(id(page_i)== 0 ) {id(my_display1).show_page(id(page_0));}      
            if(id(page_i)== 1 ) {id(my_display1).show_page(id(page_1));}       
            if(id(page_i)== 2 ) {id(my_display1).show_page(id(page_2));}
            if(id(page_i)== 3 ) {id(my_display1).show_page(id(page_3));}                         
            id(my_display1).update();}