interval:
  - interval: 1s
    then:
       - lambda: |-            
            static char buf[11]; 
            float f=0;
            int r,g,b;
            int fi,fd;
            // МОЩНОСТЬ ПАНЕЛИ  
               if (isnan(id(dc_power).state)) {lv_label_set_text(id(text1), "----");} //
                else{ snprintf(buf, sizeof(buf), "%i", int(id(dc_power).state));   //
                      lv_label_set_text(id(text1), buf);    // обновление для 1 страниц
                      
                     }                         //

            // МОЩНОСТЬ СЕТЬ
               if (isnan(id(z2_ph0_power).state)) {lv_label_set_text(id(text2), "----");}  //  
                else{ snprintf(buf, sizeof(buf), "%i", int(id(z2_ph0_power).state));         //
                       lv_label_set_text(id(text2), buf);    // обновление для 1 страниц
                      
                     }                                //
            
            // МОЩНОСТЬ БАТАРЕЯ        
               if(id(bat_power).state!=id(bat_power).state) {lv_label_set_text(id(text3), "----");} //
                else{ fi=int(id(bat_power).state);
                      if(fi<0) { r=255; g=80; b=0; fi=-fi; } // устанавливаем цвет рыжий   
                           else{ r=0;   g=255; b=0; } // устанавливаем цвет зеленый
                      lv_obj_set_style_text_color( id(text3), lv_color_make(r, g, b), LV_PART_MAIN );     // 1 
                      
                      snprintf(buf, sizeof(buf), "%i", abs(fi) ); 
                      lv_label_set_text(id(text3), buf);    // обновление для 1 страниц                          
                                       
                     }

            // МОЩНОСТЬ потребление ДОМ  sensor: z2_ph1_power
               if(id(z2_ph1_power).state!=id(z2_ph1_power).state) {lv_label_set_text(id(text4), "----");} //
                else{ snprintf( buf, sizeof(buf), "%i", int(id(z2_ph1_power).state) ); 
