    x_min: 0  # L:200    R:200 
    x_max: 480  # L:3830  R:3830 
    y_min: 0  # L:170    R:170
    y_max: 272 # L:3780   R:3780
#  transform:
#    swap_xy: true #  L:true  R:true
#    mirror_x: true # L:true  R:false
#    mirror_y: true # L:true  R:false
