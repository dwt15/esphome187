esphome:
  name: display2748
  friendly_name: display2748
  platformio_options:
     #build_flags: "-DBOARD_HAS_PSRAM"
     #board_build.esp-idf.memory_type: qio_opi
     board_build.flash_mode: dio
     #board_upload.maximum_ram_size: 327680
  on_boot:
    priority: 600.0
    then:
      - lambda: |- 
          id(led_tft).set_level(1); // id(t1)/100.0);
      - delay: 3s
      - script.execute: restore_data 
      - lambda: |- 
          id(led_tft).set_level(id(t1)/100.0);
      - lambda: |- 
          auto button = id(bt2);

          // Используем lv_obj_add_event_cb вместо lv_obj_set_event_cb
          lv_obj_add_event_cb(button, [](lv_event_t *e) {
            
            lv_event_code_t code = lv_event_get_code(e);
            lv_obj_t *obj = lv_event_get_target(e);

            // Обработка касания и удерживания для перетаскивания
            if (code == LV_EVENT_PRESSED) {
              lv_point_t p;
              lv_indev_get_point(lv_indev_get_act(), &p);

              id(player_old_x) = p.x;
              id(player_old_y) = p.y; 
            } else if (code == LV_EVENT_PRESSING) {
              lv_point_t p;
              lv_indev_get_point(lv_indev_get_act(), &p);

              lv_obj_set_pos(obj, lv_obj_get_x(obj) + p.x - id(player_old_x), lv_obj_get_y(obj) + p.y - id(player_old_y));

              id(player_old_x) = p.x;
              id(player_old_y) = p.y;
            }
            }, LV_EVENT_ALL, NULL);

