# Define a PWM output on the ESP32
 
globals:
 
  - id: display_yrkost #
    type: int
    initial_value: '60' 
    restore_value: yes


time:
  - platform: sntp
    id: my_time
    timezone: "Europe/Kyiv"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    update_interval: 3600s
#time:
#  - platform: sntp # <my_time>         [obj_timed]: {time_t1}, {time_t2}, {time_t3}, {time_td}, {time_tm}
#    id: my_time
    on_time:
      - seconds: /1  # каждую секунду
        then:
          - lambda: |-
             //
               auto now = id(my_time).now();
               if (!now.is_valid()) return;

               static int last_sec = -1;
               static int last_min = -1;
               static int last_hour = -1;
               static int last_day = -1;
               static int last_month = -1;
               static int last_wday = -1;    
               int sec = now.second;
               int min = now.minute;
               int hour = now.hour;
               int day = now.day_of_month;
               int month = now.month;
               int wday = now.day_of_week;  // 0 = воскресенье, 1 = понедельник ...
               char buf[20];
             // СЕКУНДЫ   {time_t3}
               if (sec != last_sec) {
                 last_sec = sec;
                 snprintf(buf, sizeof(buf), "%02d", sec);
                 lv_label_set_text(id(time_t3), buf);
               }
             // МИНУТЫ + ЧАСЫ
               if (min != last_min) {
                 last_min = min;
                 snprintf(buf, sizeof(buf), "%2d:%02d", hour,  min);
                 lv_label_set_text(id(time_t2), buf);
               }
             // ЧАСЫ
               //if (hour != last_hour) {
               //  last_hour = hour;
               //  snprintf(buf, sizeof(buf), "%02d", hour);
               //  lv_label_set_text(id(time_t3), buf);
               //}
             // день недели
               if (wday != last_wday) {
                 last_wday = wday;
                 const char* wday_names[] = {"ВС","ПН","ВТ","СР","ЧТ","ПТ","СБ"}; // массив наименований день недели{
                 lv_label_set_text(id(time_t1), wday_names[wday-1]);                      
                 lv_color_t colort = lv_color_make(0,200,0);  // цвет нормальный
                 if (wday == 1 or wday == 7 ) {colort = lv_color_make(255,150,0);}  // воскресенье суббота
                 lv_obj_set_style_text_color(id(time_t1), colort, LV_PART_MAIN); // цвет дня недели
                 colort = lv_color_make(0,200,0);  // цвет нормальный
                 if (wday == 1) {colort = lv_color_make(255,150,0);}  // воскресенье
                 lv_obj_set_style_text_color(id(time_td), colort, LV_PART_MAIN); // цвет даты  
               }
             // день месяца
               if (day != last_day) {
                 last_day = day;
                 snprintf(buf, sizeof(buf), "%2d", day);
                 lv_label_set_text(id(time_td), buf);
               }
             // месяц
               if (month != last_month) {
                 last_month = month;
                 snprintf(buf, sizeof(buf), "%02d",  month); 
                 lv_label_set_text(id(time_tm),  buf  );
               }   

