captive_portal:

output: # яркость экрана
  - platform: ledc
    pin: 2   # яркость
    id: led_tft
i2c: # тач
  sda: 19 #19    тач
  scl: 20 #20    тач
  scan: true
  id: bus_a
one_wire: # dallas температура
  - platform: gpio
    pin: 17 # dallas температура

touchscreen:
  platform: gt911
  id: my_touch
  i2c_id: bus_a
  address: 0x5D
  calibration:
    x_min: 11  # L:200    R:200 
    x_max: 800  # L:3830  R:3830 
    y_min: 13  # L:170    R:170
    y_max: 480 # L:3780   R:3780
 #  transform:
 #    swap_xy: true #  L:true  R:true
 #    mirror_x: true # L:true  R:false
 #    mirror_y: true # L:true  R:false
  on_touch:
     - lambda: |-
           ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
               touch.x,
               touch.y,
               touch.x_raw,
               touch.y_raw
               );  
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ 

display:
  - platform: rpi_dpi_rgb
    id: my_display
    color_order: RGB
    invert_colors: True
    update_interval: never
    auto_clear_enabled: false # takes 2.8 seconds to clear the display
    dimensions:
      width: 800
      height: 480
    de_pin: 41
    hsync_pin: 39
    vsync_pin: 40
    pclk_pin: 42
    hsync_back_porch: 39
    hsync_front_porch: 50
    hsync_pulse_width: 4
    vsync_back_porch: 9
    vsync_front_porch: 8
    vsync_pulse_width: 4
    pclk_frequency: 9MHz #9MHz     
    data_pins:
      red:
        - 14        # 0 r3
        - 21        # 1 r4
        - 47        # 2 r5
        - 48        # 3 r6
        - 45        # 4 r7
      green:
        - 9         # 0 g2
        - 46        # 1 g3
        - 3         # 2 g4
        - 8         # 3 g5
        - 16        # 4 g6
        - 1         # 5 g7
      blue:
        - 15        # 0 b3
        - 7         # 1 b4
        - 6         # 2 b5
        - 5         # 3 b6
        - 4         # 4 b7        
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~             