esphome:
  name: display4880m
  friendly_name: display4880m

  platformio_options:   
       # build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
       # board_build.flash_mode: dio
      #  board_upload.maximum_ram_size: 327680
       # board_upload.maximum_ram_size: 524288
  
  on_boot:
    priority: 600.0
    then:
      - lambda: |- 
          id(led_tft).set_level(id(display_yrkost)/100.0);
      - script.execute: slider_yrkost_set 


esp32:
