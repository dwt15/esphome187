    - platform: homeassistant # grid_volt   [obj_grid]-{srv_grid_volt} [obj_main]-{main_grid_watt}Хmain_grid_watt
      id: grid_volt
      entity_id: ${grid_volt}  
      on_value: 
        then:
          - lambda: |-
              if (isnan(x) || x<170) { 
              // потеря сенсора 
                lv_label_set_text( id(srv_grid_volt), "---" );
                id(msg_2).execute(211); // служебное сообщение в лог   
              } else { 
                // обновление  метки 
                 char buf[16];
                 snprintf(buf, sizeof(buf), "%0.0f", x);           
                 lv_label_set_text( id(srv_grid_volt), buf ); 
                 id(msg_2).execute(200); // служебное сообщение в лог 
              }  
