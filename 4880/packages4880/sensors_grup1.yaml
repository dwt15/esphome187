sensor: 
    
    - platform: template # "Slider Value"
      name: "Slider Value"
      id: slider_value
      unit_of_measurement: "l"
      accuracy_decimals: 2
      update_interval: never
      on_value:
        then:
  
  # pv --------------------------------   
    - platform: homeassistant # <pv_watt>   [obj_main]-{main_pv_watt}
      id: pv_watt 
      entity_id: ${pv_watt} 
      on_value: 
        then:
          - lambda: |-         
              if (isnan(x)) { lv_label_set_text( id(main_pv_watt), "----" );
              id(msg_1).execute(111); // служебное сообщение в лог
              return; }
              else{
              char buf[16];
              snprintf(buf, sizeof(buf), "%0.0f", x); lv_label_set_text( id(main_pv_watt), buf );       
              id(msg_1).execute(100); // служебное сообщение в лог
              }
      #------------------------------------------------------------------------
    - platform: homeassistant # <pv_day>    [obj_main]-{main_pv_dayi}&{main_pv_dayd}
      id: pv_day  # сутки генерация
      entity_id: ${pv_day}
      on_value: 
        then:
          - lambda: |-             
              if (isnan(x)) {
              lv_label_set_text( id(main_pv_dayi), "--.");
              lv_label_set_text( id(main_pv_dayd), "-");
              id(msg_1).execute(211); // служебное сообщение в лог
              return; }
              else{    
              char buf[16];
              int fi,fd;             
              fi=int(x); fd=int(10*(x-fi)); // fi-цел fd-дес                         
              snprintf(buf, sizeof(buf), "%i.", fi);lv_label_set_text( id(main_pv_dayi), buf); // {main_pv_dayi} 
              snprintf(buf, sizeof(buf), "%i",  fd);lv_label_set_text( id(main_pv_dayd), buf); // {main_pv_dayd}                  
              id(msg_1).execute(200); // служебное сообщение в лог
              }
