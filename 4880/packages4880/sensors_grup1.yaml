  # grid --------------------------------   
    - platform: homeassistant #    [obj_main]-{main_grid_watt}
      id: grid_watt
      entity_id: ${grid_watt} # потребление с внешней сети    
      on_value: 
        then:
          - lambda: |-
              if (!isnan(x)) {
                if( id(grid_state).state ) {
                // обновлять если свич включен
                 char buf[16]; snprintf(buf, sizeof(buf), "%0.0f", x);
                 lv_label_set_text( id(main_grid_watt), buf ); //              
                 lv_label_set_text( id(srv_grid_watt) , buf );  //
                 id(msg_2).execute(100); // служебное сообщение в лог
                }
              }
