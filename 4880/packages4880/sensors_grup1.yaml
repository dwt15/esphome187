   # dallas 1820b
    - platform: dallas_temp # <mytempc>  [obj_timed]-{time_mytempi}&{time_mytempd}
      address: $mytempc  
      name: "mytemperature"
      id: mytempc
      accuracy_decimals: 1 
      update_interval: 20s
      on_value: 
        then:
          - lambda: |-
              if (isnan(x)) {
              lv_label_set_text( id(time_mytempi), "--.");
              lv_label_set_text( id(time_mytempd), "-");
              id(msg_5).execute(11111); // служебное сообщение в лог
              return; }
              else{    
              static float t=x; if(t==x){return;}
              char buf[8];
              int fi,fd;            
              fi=int(x); fd=int(10*(x-fi)); // fi-цел fd-дес                         
              snprintf(buf, sizeof(buf), "%i.", fi);lv_label_set_text( id(time_mytempi), buf); // {main_grid_dayi} 
              snprintf(buf, sizeof(buf), "%i",  fd);lv_label_set_text( id(time_mytempd), buf); // {main_grid_dayd}                  
              id(msg_5).execute(10000); // служебное сообщение в лог
              }
