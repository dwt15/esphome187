      on_value: 
        then:
          - lambda: |-
              if (isnan(x)) { 
              lv_label_set_text( id(main_batx_watt), "--.-" );
              lv_label_set_text( id(srv_batx_ah), "---" );
              id(msg_3).execute(2111); // служебное сообщение в лог
              return; }
              else{            
              char buf[16];
              snprintf(buf, sizeof(buf), "%0.0f", x);
              lv_label_set_text( id(srv_batx_ah), buf );// {serv_batx_ah}          
              int fi,fd;
              float f=x/20+0.05;
              fi=int(f); fd=int(10*(f-fi)); // fi-цел fd-дес                         
              snprintf(buf, sizeof(buf), "%i.", fi);
              lv_label_set_text( id(main_batx_kwhi), buf); // [obj_main]{text_m3i}  целое   
              snprintf(buf, sizeof(buf), "%i",  fd);
              lv_label_set_text( id(main_batx_kwhd), buf); // [obj_main]{text_m3d}  десятичн
              id(msg_3).execute(2000); // служебное сообщение в лог 
