script:
  - id: chek_butt_dom_${xx}  #09 #
    then:
      - lambda: |-
          //       
            int p=-1;
            int sbut;
            int per=15;             
            char buf[16];
             

            lv_color_t colr_on   = lv_color_make(240,  240, 0);    //  желтй
            lv_color_t colr_off  = lv_color_make(64,  64, 48);     // 4 черн  кнопки отключенно 
            lv_color_t colr_offn = lv_color_make(0,  104, 0);     //  темнозеленій
            lv_color_t colr_pw   = lv_color_make(255,  0, 0);     // red power
            lv_color_t colr_bl   = lv_color_make(0,  0, 64);     // blu redyо
            
          //-- c1  ${xx} 
              static int s_butt_${xx} =-1;  //  
              static int t_butt_${xx} = 100;
              static int        ${xx} =-100;             

              if(   t_butt_${xx} < per) {t_butt_${xx}++;}
              else {t_butt_${xx} = 0;    s_butt_${xx}  = -1; ${xx}=-100;} 
            
            if(  isnan(id(butt_dom_${xx}p).state) ) { sbut = 0;                               // 0 - не доступен    
                if  (s_butt_${xx} != sbut ) {                                                 // новое состояние
                     s_butt_${xx} = 0;                                                        // запоминаем 
                     t_butt_${xx} = 0;                                                        // сброс таймера 
                    lv_obj_clear_flag(        id(butt_dom_${xx}x), LV_OBJ_FLAG_HIDDEN);       // показать "X"   
                  lv_obj_set_style_text_color(id(butt_dom_${xx}i), colr_off, LV_PART_MAIN);   // grey
                  lv_obj_set_style_text_color(id(butt_dom_${xx}n), colr_offn, LV_PART_MAIN);  // grey
                  lv_obj_set_style_text_color(id(butt_dom_${xx}w), colr_off, LV_PART_MAIN);   // grey
                  lv_obj_set_style_text_color(id(butt_dom_${xx}r), colr_off, LV_PART_MAIN);   // grey
                }                                              
            } else {                                                                 // 1-в сети OFF           
                if( s_butt_${xx} == 0 ){lv_obj_add_flag(id(butt_dom_${xx}x), LV_OBJ_FLAG_HIDDEN);} // убрать "X"     
                
                if( id(butt_dom_${xx}s).state ){                                       // 2- ON
                   sbut = 2;
                   p=static_cast<int>(id(butt_dom_${xx}p).state);                               //  считывае значенние 
                   if(s_butt_${xx} != sbut){
                      s_butt_${xx}  = sbut;
                      t_butt_${xx} = 0;
                      lv_obj_set_style_text_color(id(butt_dom_${xx}i), colr_on, LV_PART_MAIN); //,  
                      lv_obj_set_style_text_color(id(butt_dom_${xx}n), colr_on, LV_PART_MAIN); //  
                      lv_obj_set_style_text_color(id(butt_dom_${xx}w), colr_on, LV_PART_MAIN); //  
                      lv_obj_set_style_text_color(id(butt_dom_${xx}r), colr_on, LV_PART_MAIN); //  
                      lv_obj_add_state(           id(butt_dom_${xx}b), LV_STATE_CHECKED);          
                   }
               
                } else { 
                    sbut=1;
                    p=0;
                    if(s_butt_${xx} != sbut){
                       s_butt_${xx}  = sbut;
                       t_butt_${xx} = 0;                    
                       
                       lv_obj_clear_state(         id(butt_dom_${xx}b), LV_STATE_CHECKED);   
                       lv_obj_set_style_text_color(id(butt_dom_${xx}i), colr_off,  LV_PART_MAIN); //, LV_STATE_CHECKED); //  
                       lv_obj_set_style_text_color(id(butt_dom_${xx}n), colr_offn, LV_PART_MAIN); //  
                       lv_obj_set_style_text_color(id(butt_dom_${xx}w), colr_off,  LV_PART_MAIN); //  
                       lv_obj_set_style_text_color(id(butt_dom_${xx}r), colr_off,  LV_PART_MAIN); //                     
                    }  
                }                                                                                          
                if(${xx} != p){                                               
                   ${xx}  = p;                                                            
                   t_butt_${xx} = 0;  
                   snprintf(buf, sizeof(buf), "%i",p);                                
                   lv_label_set_text( id(butt_dom_${xx}w), buf );                             
                   if(p>5){lv_obj_set_style_bg_color(id(butt_dom_${xx}b), colr_pw, LV_STATE_CHECKED);} // red
                     else {lv_obj_set_style_bg_color(id(butt_dom_${xx}b), colr_bl, LV_STATE_CHECKED);} // blue
                }                    
            }