# setup board
  esphome:
    name: dsp8
    friendly_name: dsp8
    comment: "test graf" #${device_description}  
    on_boot:
      priority: 600
      then:     
        - output.turn_on: led_sv
        - output.turn_on: gpio_17
        - output.turn_on: gpio_16
        - output.turn_on: gpio_4
        - lambda: |-
              id(led_sv).set_level(0.2);
   # - - - - - - - - - - - - - - - 
  esp32:
    board: esp32dev
    framework:
      type: esp-idf
   # - - - - - - - - - - - - - - - 
  logger:
   # - - - - - - - - - - - - - - - 
  api:
    encryption:
      key: "Ki8QnShKTuGaSFgcMLrQErDdJZ12uNmmVLN+rnIDNqs="
   # - - - - - - - - - - - - - - - 
  ota:
    - platform: esphome
      password: "b71c2d15df648e78d7f8091c1e82b72e"
   # - - - - - - - - - - - - - - - 
  wifi:
    ssid: !secret wifi_ssid
    password: !secret wifi_password
    ap:
      ssid: "Dsp8 Fallback Hotspot"
      password: "YDpDztBBC1SN"
   # - - - - - - - - - - - - - - - 
  captive_portal:
   #- - - - - - - - - - - - - - -
  output:
    - platform: ledc
      pin: 21
      id: led_sv 
    - platform: ledc
      pin: 17
      id: gpio_17 # blue
    - platform: ledc
      pin: 16
      id: gpio_16 # green       
    - platform: ledc
      pin: 4 
      id: gpio_4 # red
    - platform: ledc  # бузер     
      pin: 26
      id: rtttl_out 
   # - - - - - - - - -
  spi:
    - id: spi0 # для дисплея
      clk_pin: 14
      mosi_pin: 13
    #    miso_pin: 12
    - id: spi1 #  для тача
      clk_pin: 25
      mosi_pin: 32
      miso_pin: 39
   # - - - - - - - - - - - - - -

   # - - - - - - - - -
  touchscreen:
    platform: xpt2046
    id: my_touch
    spi_id: spi1
    cs_pin: 33
    calibration:
      x_min: 200  # L:200    R:200 
      x_max: 3830  # L:3830  R:3830 
      y_min: 170  # L:170    R:170
      y_max: 3780 # L:3780   R:3780
    transform:
      swap_xy: true #  L:true  R:true
      mirror_x: true # L:true  R:false
      mirror_y: true # L:true  R:false
    on_touch:
        - lambda: |-
            ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
                touch.x,
                touch.y,
                touch.x_raw,
                touch.y_raw
                );  
            id(my_rtttl).play(id(b_txt).state.c_str());
       # - rtttl.play: "${beep2}"
   
   #--------------- 
  display:
    - platform: ili9xxx
      model:  ILI9341 #TFT 2.4
      id: my_display1     
      spi_id: spi0
      cs_pin: 15   
      dc_pin: 2  
      invert_colors: false    
      color_palette: 8BIT    
      color_order: rgb
      transform:      
        mirror_x: true #  L:true   R:false 
        mirror_y: false # L:false  R:true 
        swap_xy: false # L:false   R:false
      dimensions:
        height: 240
        width: 320     
   # - - - - - - - - - - - - - -  - - - - 
# add device/component
  rtttl:
    output: rtttl_out
    id: my_rtttl
    gain: 10%
  time:
    - platform: sntp
      id: my_time
      timezone: "Europe/Kyiv"
      servers:
        - 0.pool.ntp.org
        - 1.pool.ntp.org
        - 2.pool.ntp.org
      update_interval: 3600s  
