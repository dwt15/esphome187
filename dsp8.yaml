                                                                                    id(sn_led4_s)
                                                                                    };             
             static esphome::homeassistant::HomeassistantSensor*  sn_led_w[]={id(sn_led1_w),     // id sensor  
                                                                              id(sn_led2_w),
                                                                              id(sn_led3_w),
                                                                              id(sn_led4_w)
                                                                              };
             static esphome::homeassistant::HomeassistantSensor*  sn_led_v[]={id(sn_led1_v),     // id sensor  
                                                                              id(sn_led2_v),
                                                                              id(sn_led3_v),
                                                                              id(sn_led4_v)
                                                                             };            
             static lv_obj_t*  obj_m1_led[] ={id(obj_m1_led1),               // id label  
                                              id(obj_m1_led2),
                                              id(obj_m1_led3),
                                              id(obj_m1_led4)
                                              };
                                             
             for(int i=0; i<4; i++){   
                
                //if( sn_led_v[i]->state < 170 || isnan(sn_led_v[i]->state)){ //
                  if(isnan(sn_led_w[i]->state)){
                       led_st = 0;}                                      // не в сети 
                  else{led_st = 1;                                       // в сети
                  if( sn_led_s[i]->state){led_st = 2;             // включена              
                    if( sn_led_w[i]->state > 10) {  led_st = 3;}   // есть нагрузка 
                  }    
                } 
                if(led[i] != led_st){
                   led[i]  = led_st;
                         if(led_st == 0){lv_led_set_color(obj_m1_led[i], lv_color_hex(${clr_led_s0}));
                                    lv_led_set_brightness(obj_m1_led[i], 255);}   
                    else if(led_st == 1){lv_led_set_color(obj_m1_led[i], lv_color_hex(${clr_led_s1}));
                                    lv_led_set_brightness(obj_m1_led[i], 255);}                
                    else if(led_st == 2){lv_led_set_color(obj_m1_led[i], lv_color_hex(${clr_led_s2}));
                                    lv_led_set_brightness(obj_m1_led[i], 155);}
                    else if(led_st == 3){lv_led_set_color(obj_m1_led[i], lv_color_hex(${clr_led_s3}));
                                    lv_led_set_brightness(obj_m1_led[i], 255);}
                ESP_LOGW("led", "led_st %d",led_st);
                }
             }    


